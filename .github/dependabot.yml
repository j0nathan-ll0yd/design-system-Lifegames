version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group ajv + ajv-formats so they update together. They share a
      # versioning cadence and historically a mismatched pair has broken
      # validation (8.18 -> 8.20 incident, May 2026).
      ajv:
        patterns:
          - ajv
          - ajv-formats
          - ajv-cli
      # Group all Storybook packages so they always bump together.
      # Partial upgrades break the addon API (framework adapter + addon
      # version mismatch). Replaces the former major-version ignore rules.
      storybook:
        patterns:
          - "@storybook/*"
          - storybook
    ignore:
      # ajv majors require coordinated migration of validate.ts and all
      # consumer schemas. Bump manually after testing.
      - dependency-name: ajv
        update-types: [version-update:semver-major]
      - dependency-name: ajv-formats
        update-types: [version-update:semver-major]
      - dependency-name: ajv-cli
        update-types: [version-update:semver-major]
      # Astro v5 -> v6 requires a coordinated migration: peer-dep cascade
      # through @astrojs/starlight, @vite-pwa/astro, and the consumer web
      # repo. Tracked manually; do not bump majors automatically.
      - dependency-name: astro
        update-types: [version-update:semver-major]
      # @astrojs/starlight is pre-1.0 -- minors can contain breaking
      # changes. 0.34 -> 0.39 fails docs-build today. Pin to current minor
      # until the docs site has been verified against a newer version.
      - dependency-name: "@astrojs/starlight"
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-artifacts:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
