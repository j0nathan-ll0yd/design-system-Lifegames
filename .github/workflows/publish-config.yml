name: Publish @j0nathan-ll0yd/config

# Publishes ONLY packages/config to GitHub Packages. This is the reproducible
# publish path — it uses the built-in Actions GITHUB_TOKEN, never a local token.
#
# Trigger deliberately: manual dispatch, or push a `config-v*` tag. Bump the
# `version` field in packages/config/package.json before triggering.
on:
  workflow_dispatch:
  push:
    tags:
      - 'config-v*'

permissions:
  packages: write
  contents: read

jobs:
  publish:
    # GitHub-hosted runner: hermetic, no dependency on the self-hosted fleet, and
    # @j0nathan-ll0yd/config has no build step and no workspace-protocol deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@j0nathan-ll0yd'
      # npm publish packs from the package dir; no workspace install needed since
      # @j0nathan-ll0yd/config declares only public-registry deps (no workspace:* refs).
      - name: Publish
        working-directory: packages/config
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
