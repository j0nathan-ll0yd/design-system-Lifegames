name: Release (Version PR)

# Changesets opens version-only PRs here; publishing runs separately after merge. A PAT is
# required so those PRs trigger normal CI. Without the secret, this workflow stays inert.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Install resolves the scoped workspace deps (portal-contract, config) from
  # GitHub Packages; `packages: read` covers that (same as ci.yml).
  packages: read

# Serialise Version-PR runs on main; do not cancel an in-flight run — it may be
# mid git-push / PR-update and interrupting it can leave a half-written branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    # GitHub-hosted runner: hermetic and independent of the self-hosted fleet,
    # matching the sibling release-plane workflow (publish-ds-packages.yml).
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      # Persist the PAT (not the default GITHUB_TOKEN) as the git credential:
      # changesets/action pushes the Version branch with whatever checkout
      # persisted, and GitHub suppresses CI on GITHUB_TOKEN-pushed commits — so a
      # default-token push would open a Version PR that never triggers the
      # required checks. The action's own token/env only covers the PR API call.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.CHANGESETS_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # `pnpm install` must resolve the scoped workspace deps (portal-contract,
      # config) from GitHub Packages. The built-in GITHUB_TOKEN covers packages: read;
      # this is the SAME auth wiring every ci.yml job uses.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # Version-only: apply pending changesets (bump + changelog) and open/update
      # the Version PR. No `publish-script:` input — publishing lives in
      # publish-ds-packages.yml. github-token + env.GITHUB_TOKEN are the PAT so the
      # opened PR triggers required CI (see header).
      #
      # `changeset:version` formats the changelogs it writes, and must keep doing so.
      # `changeset version` indents each changeset body by two spaces when it folds it into
      # CHANGELOG.md, and it applies that indent to the body's BLANK lines too — leaving two
      # trailing spaces on every blank line. `prettier --check` reds on exactly that, so the
      # Version PR was born failing its own required `format` check and could not be merged.
      # Measured on the 3.0.0 copy release (2026-09-22): 24 insertions, 25 deletions in
      # packages/copy/CHANGELOG.md, all of it trailing whitespace, no content change.
      # A one-paragraph changeset never trips it, which is why this surfaced only once a
      # changeset carried multiple paragraphs. Formatting the generated file is the fix; do not
      # instead exempt CHANGELOG.md from prettier, which would trade a blocked release for an
      # unformatted artifact nobody checks.
      - name: Create Version Packages PR
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm changeset:version
          commit-message: 'ci(release): version packages'
          pr-title: 'ci(release): version packages'
          github-token: ${{ secrets.CHANGESETS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
