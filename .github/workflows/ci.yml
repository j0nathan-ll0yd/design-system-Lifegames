name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` lets every install resolve @j0nathan-ll0yd/portal-contract
# (and @j0nathan-ll0yd/config) from GitHub Packages; `contents: read` covers
# checkout. See the "Authenticate to GitHub Packages" step in each job.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # format:check runs dprint (TS/JS/JSON) + prettier (astro/md/mdx/css).
      - run: pnpm format:check

  typecheck:
    # tsc --noEmit across the packages that extend @j0nathan-ll0yd/config's
    # tsconfig-base (schemas, fixtures, web, storybook). `turbo run typecheck`
    # builds workspace deps first (^build) so cross-package types resolve.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  schemas-freshness:
    # Verifies vendored LP schemas + generated TS/Swift artifacts are not stale.
    # Soft on missing LP (CI has no LP checkout) — vendored/ is the source of truth in CI.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:schemas-freshness
      - name: Verify schema contract
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-contract-check')"
        run: pnpm -F @j0nathan-ll0yd/schemas contract:verify
        env:
          CONTRACT_CHECK_MODE: blocking

  package-version-drift:
    # C147. Catches "a published package's payload changed but nobody bumped that
    # package's version". No other gate sees it: typecheck, lint and tests all
    # pass, and `changeset publish` SILENTLY SKIPS any version already on the
    # registry and exits 0 — so consumers just never receive the change.
    #
    # THE STATUS CONTEXT TO REQUIRE IN BRANCH PROTECTION IS `package-version-drift`
    # (the job id, identical in mantle/LP/OMD so one set of gh commands covers the
    # estate). It IS required on `main` as of 2026-08-04: a red gate now BLOCKS merge,
    # which is why the transport retries a throttled 403 rather than let a momentary
    # throttle fail the check (see REQUEST_ATTEMPTS in scripts/check-package-drift.mjs).
    #
    # No fetch-depth: 0. The previous generation walked each manifest's own commit
    # history to find the version-setting commit, so it needed the full history
    # (and a shallow graft boundary looked exactly like a real root commit — a
    # silent total pass). The check is now CONTENT-BASED: it compares the payload
    # this checkout would publish against the payload already published under the
    # declared version. The only git it does is one `git ls-files` per package for
    # the leak screen, which is depth-independent.
    #
    # It DOES now need an install and a build (the payload includes dist/), and a
    # registry token — GitHub Packages returns E401 even for public packages, so
    # there is no anonymous fallback and a missing token is INDETERMINATE/exit 3,
    # never a pass.
    #
    # FORK PRs (finding D12). This job deliberately carries NO job-level `if:`, unlike its
    # thirteen siblings in this file. They may skip; a gate intended to be a REQUIRED
    # status context may not, because GITHUB REPORTS A SKIPPED JOB AS SATISFYING A REQUIRED
    # CHECK. Requiring `package-version-drift` while it skips on fork PRs would therefore
    # buy nothing on exactly the pull requests a maintainer has least reason to trust: the
    # context would go green having measured nothing. That is the "I could not tell, so
    # pass" laundering the engine itself refuses to do at the verdict layer (a dead
    # registry, a missing token or an empty inventory are all exit 3, never 0), and it must
    # not be reintroduced at the workflow layer.
    #
    # It genuinely CANNOT measure fork-PR code: it runs on SELF-HOSTED runners and its
    # measurement is `pnpm install` + a real workspace build + `pnpm pack`, i.e. arbitrary
    # execution of the pull request's code on this estate's own hardware with a GitHub
    # Packages token in the environment. So it runs and fails LOUDLY instead. The refusal
    # is the FIRST step and precedes `actions/checkout`, so no fork-controlled byte is ever
    # fetched, let alone executed — for a `pull_request` event the workflow definition
    # itself comes from the base branch, so the self-hosted runner only ever echoes.
    #
    # A maintainer clears it by pushing the branch to this repository, which is what they
    # must do to land it in any case. If that trade is ever judged wrong, the one-line
    # revert is to restore the sibling `if:` — but then this context MUST NOT be added to
    # branch protection, because a required-and-skippable check is worse than no check.
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Refuse to measure fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=package-version-drift cannot evaluate a fork PR::This gate builds and packs the workspace on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check - it would claim 'no drift' having measured nothing. Push the branch to this repository and re-run."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # D4 — THE SHARED DIGEST CONTRACT, AND IT RAN IN NO WORKFLOW AT ALL.
      # scripts/check-package-drift.test.mjs carries the 34 cross-implementation
      # conformance vectors vendored from atlas/contracts/package-digest/, AND the
      # Layer-1 assertion that the vendored fixture still hashes to
      # DRIFT_CONFORMANCE_SHA256 — the check that makes vendoring safe rather than
      # merely convenient. It was reachable only through `pnpm test:scripts`, which
      # appears in .husky/pre-push and in no workflow on any event, so this repo
      # could diverge from the canonical normalization rule with all 20 CI checks
      # green and only a local pre-push hook standing between that and a merge.
      # It is 52 assertions in ~70 ms and runs FIRST: a digest rule that no longer
      # agrees with the estate makes every verdict below meaningless.
      - name: Digest conformance + unit suite (34 shared vectors, fixture checksum)
        run: node --test scripts/check-package-drift.test.mjs
      # A2b — a gate that can never fail is as dangerous as one that never runs.
      # --self-test stands up a throwaway git repo and an offline registry, runs
      # the SHIPPED pipeline end to end against them, and then re-runs it under
      # thirteen deliberate SOURCE-TEXT mutations, failing if any survives.
      #
      # Four of those thirteen cross the PROCESS boundary, and that number is the
      # point (finding D3). Every in-process assertion reads the pipeline's return
      # value, so the exit site itself was untested and a one-line change there kept
      # the whole suite green while the gate exited 0 on real drift (finding X2).
      # One spawned rung was not enough either: it asserted only DRIFT -> 2, so any
      # edit that PRESERVED 2 stayed invisible. S13/S17/S18/S19 now spawn the script
      # as a real OS process at a drift, a clean tree, a dead registry and an empty
      # inventory, pinning exits 2/0/3/3 — MEASURED: with `process.exitCode` rewritten
      # to launder exit 3 into 0, the previous suite reported "self-test passed, all
      # 9 mutations killed" while every "could not tell" became a pass.
      #
      # It requires npm on PATH as well as pnpm — S14 seeds the toy registry with
      # `npm pack` to reproduce the npm-publish/pnpm-pack manifest asymmetry
      # (finding X3) end to end.
      - name: Known-answer self-test (must prove it can fail)
        run: node scripts/check-package-drift.mjs --self-test
      - name: Package payload drift
        run: node scripts/check-package-drift.mjs --lane=branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  copy:
    # @j0nathan-ll0yd/copy: build (validate rich + derive flat + codegen TS/Zod/Swift),
    # unit tests (Ajv + ICU MF1 parse + maxChars + flat round-trip), and the D9
    # zero-dependency leaf-boundary lint. The freshness git-diff of copy's
    # generated artifacts is covered by the schemas-freshness job above.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @j0nathan-ll0yd/copy build
      - run: pnpm -F @j0nathan-ll0yd/copy test
      - run: pnpm -F @j0nathan-ll0yd/copy lint
      # Grep gate: fail if a migrated copy value reappears hardcoded
      # in consumer source (DS web widgets + runtime + Swift widgets).
      - run: pnpm -F @j0nathan-ll0yd/copy grep-gate
      # Voice & mechanics gate: the register/audience enum is enforced by the
      # build (Ajv); check-copy-voice.mjs adds banned terms, punctuation, and the
      # human↔AI arbitration rule (no allusion in machine surfaces). See VOICE.md.
      - run: pnpm -F @j0nathan-ll0yd/copy voice

  fixtures:
    # @j0nathan-ll0yd/fixtures: generate (deterministic raw + post-adapter fixtures) +
    # validate (Ajv against portal-contract raw + @j0nathan-ll0yd/schemas display schemas)
    # + unit tests (barrel shape + starredRepos adapter-derived determinism) + lint.
    # The freshness git-diff of the committed fixture output is covered by the
    # schemas-freshness job above (it re-runs `pnpm -F @j0nathan-ll0yd/fixtures generate`).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @j0nathan-ll0yd/fixtures build
      - run: pnpm -F @j0nathan-ll0yd/fixtures test
      - run: pnpm -F @j0nathan-ll0yd/fixtures lint

  build-tokens:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - name: DTCG 2025.10 conformance check
        run: node scripts/validate-dtcg.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-dist
          path: packages/tokens/dist/

  lint-web:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm lint
      - name: CSP inline-JS audit (Plan #07 sibling gate)
        run: pnpm -F @j0nathan-ll0yd/web audit:inline-scripts

  build-web:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      # pnpm<=9 exited 0 with a warning when the filtered package had no "build"
      # script — @j0nathan-ll0yd/web has none (it ships source, not a build artifact), so this job
      # never built anything. pnpm 11 turned the missing script into a hard error,
      # exposing it. Run the real workspace build (turbo) instead.
      - run: pnpm build

  storybook-build:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter storybook storybook:build
      # Optional Chromatic step:
      # - uses: chromaui/action@latest
      #   with:
      #     projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      #     storybookBuildDir: apps/storybook/storybook-static

  # The Swift job runs on a self-hosted Mac (shared with ios-LifegamesPortal).
  # Deliberately the ONLY macOS job — one cold compile + one queue acquisition
  # per run (see .omc/plans/contract-tests-ci-perf.md).
  # Security: the `if` guard below skips it for fork PRs so untrusted code
  # from forks never executes on the host Mac. Internal-branch PRs and
  # pushes to main still run normally. External contributors: maintainer must
  # re-push the PR to a branch in this repo to get Swift coverage.
  test-swift:
    needs: [build-tokens]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 20
    env:
      SNAPSHOT_ENV: ci
      # Prevent snapshot tests from recording new reference images in CI;
      # any mismatch is a test failure, not a silent re-record.
      SNAPSHOT_TESTING_RECORD: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode.app' \) 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 not found. Available versions:"
            ls /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      # Also enforces the cross-platform fixture contract (LifegamesWidgetsTests/ContractTests).
      # Do not add --filter — that would silently drop contract coverage.
      - run: swift test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: snapshot-diffs
          path: Tests/**/__Snapshots__/**/*.png

  contract-ts:
    # Web Props TypeScript contract check — moved off the macOS runner (no Xcode dep).
    # The Swift side of the contract is covered by test-swift's unfiltered `swift test`
    # (Tests/LifegamesWidgetsTests/ContractTests.swift).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # This job runs the web unit suite (updaters/adapters — the TS side of the
      # Props contract), which previously ran in NO CI job.
      # It deliberately does NOT typecheck: packages/web gained a real
      # tsconfig.json in #142 and is type-checked by the dedicated `typecheck`
      # job (turbo run typecheck), so duplicating it here would only add runtime.
      # The step that used to sit here (pnpm --filter @j0nathan-ll0yd/web tsc) was a
      # silent no-op — no tsconfig meant tsc printed help and exited 0 via
      # pnpm<=9's implicit exec fallback. See #110.
      - name: Web unit tests (updaters/adapters Props contract)
        run: pnpm --filter @j0nathan-ll0yd/web test

  governance-gates:
    name: governance-gates
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - name: Widget inventory drift (P5)
        run: pnpm widget:inventory -- --check
      - name: P1 token parity (web/Swift accent hex)
        run: node scripts/check-token-parity.mjs --check
      - name: WCAG-AA contrast gate
        run: node scripts/check-contrast.mjs
      - name: P3 Swift widget purity
        run: node scripts/check-swift-widget-purity.mjs --check
      - name: Watch exclusions (F-014)
        run: node scripts/check-watch-exclusions.mjs --check
      - name: P4/P7 promotion gate
        run: node scripts/check-promotion.mjs --check
      - name: P2 widget compliance (registry ↔ Astro/fixture/manifest)
        run: node scripts/widget-compliance.mjs
      - name: Style Dictionary golden-file characterization (F-005)
        run: pnpm --filter @j0nathan-ll0yd/tokens test
      - name: S22 preview scheme audit
        run: bash scripts/check-preview-scheme.sh

  docs-build:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter docs build
