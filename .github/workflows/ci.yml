name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas-freshness:
    # Verifies vendored LP schemas + generated TS/Swift artifacts are not stale.
    # Soft on missing LP (CI has no LP checkout) — vendored/ is the source of truth in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:schemas-freshness

  build-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - uses: actions/upload-artifact@v4
        with:
          name: token-dist
          path: packages/tokens/dist/

  lint-web:
    needs: build-tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm lint

  build-web:
    needs: build-tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter @lifegames/web build

  storybook-build:
    needs: build-tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter storybook storybook:build
      # Optional Chromatic step:
      # - uses: chromaui/action@latest
      #   with:
      #     projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      #     storybookBuildDir: apps/storybook/storybook-static

  build-swift:
    # macos-26 (Tahoe) GA since 2026-02-26; Xcode 26.4.1 is the default.
    # No xcode-select needed — runner default ships Swift 6.2 + iOS 26 / watchOS 26 SDKs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode + Swift version
        run: |
          xcodebuild -version
          swift --version
      - run: swift build

  test-swift:
    needs: build-swift
    runs-on: macos-26
    env:
      SNAPSHOT_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode + Swift version
        run: |
          xcodebuild -version
          swift --version
      - run: swift test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-diffs
          path: Tests/**/__Snapshots__/**/*.png

  contract-tests:
    needs: [build-tokens, build-swift]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript Props contract check
        run: pnpm --filter @lifegames/web tsc --noEmit
      - name: Swift Props contract check
        run: swift test --filter ContractTests

  docs-build:
    needs: build-tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter docs build
