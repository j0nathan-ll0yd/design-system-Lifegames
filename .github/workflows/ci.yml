name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas-freshness:
    # Verifies vendored LP schemas + generated TS/Swift artifacts are not stale.
    # Soft on missing LP (CI has no LP checkout) — vendored/ is the source of truth in CI.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:schemas-freshness
      - name: Verify schema contract
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-contract-check')"
        run: pnpm -F @lifegames/schemas contract:verify

  copy:
    # @lifegames/copy: build (validate rich + derive flat + codegen TS/Zod/Swift),
    # unit tests (Ajv + ICU MF1 parse + maxChars + flat round-trip), and the D9
    # zero-dependency leaf-boundary lint. The freshness git-diff of copy's
    # generated artifacts is covered by the schemas-freshness job above.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @lifegames/copy build
      - run: pnpm -F @lifegames/copy test
      - run: pnpm -F @lifegames/copy lint
      # Grep gate: fail if a migrated copy value reappears hardcoded
      # in consumer source (DS web widgets + runtime + Swift widgets).
      - run: pnpm -F @lifegames/copy grep-gate

  build-tokens:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - name: DTCG 2025.10 conformance check
        run: node scripts/validate-dtcg.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: token-dist
          path: packages/tokens/dist/

  lint-web:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm lint
      - name: CSP inline-JS audit (Plan #07 sibling gate)
        run: pnpm -F @lifegames/web audit:inline-scripts

  build-web:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter @lifegames/web build

  storybook-build:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter storybook storybook:build
      # Optional Chromatic step:
      # - uses: chromaui/action@latest
      #   with:
      #     projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      #     storybookBuildDir: apps/storybook/storybook-static

  # Swift jobs run on a self-hosted Mac (shared with ios-LifegamesPortal).
  # Security: the `if` guard below skips these jobs for fork PRs so untrusted
  # code from forks never executes on the host Mac. Internal-branch PRs and
  # pushes to main still run normally. External contributors: maintainer must
  # re-push the PR to a branch in this repo to get Swift coverage.
  build-swift:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode.app' \) 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 not found. Available versions:"
            ls /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      - run: swift build
      - name: S22 preview scheme audit
        run: bash scripts/check-preview-scheme.sh

  test-swift:
    needs: [build-swift, build-tokens]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 20
    env:
      SNAPSHOT_ENV: ci
      # Prevent snapshot tests from recording new reference images in CI;
      # any mismatch is a test failure, not a silent re-record.
      SNAPSHOT_TESTING_RECORD: never
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode.app' \) 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 not found. Available versions:"
            ls /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      - run: swift test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: snapshot-diffs
          path: Tests/**/__Snapshots__/**/*.png

  contract-tests:
    needs: [build-tokens, build-swift]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode.app' \) 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 not found. Available versions:"
            ls /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: TypeScript Props contract check
        run: pnpm --filter @lifegames/web tsc --noEmit
      - name: Swift Props contract check
        run: swift test --filter ContractTests

  governance-gates:
    name: governance-gates
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - name: Widget inventory drift (P5)
        run: pnpm widget:inventory -- --check
      - name: P1 token parity (web/Swift accent hex)
        run: node scripts/check-token-parity.mjs --check
      - name: WCAG-AA contrast gate
        run: node scripts/check-contrast.mjs
      - name: P3 Swift widget purity
        run: node scripts/check-swift-widget-purity.mjs --check
      - name: Watch exclusions (F-014)
        run: node scripts/check-watch-exclusions.mjs --check
      - name: P4/P7 promotion gate
        run: node scripts/check-promotion.mjs --check
      - name: Style Dictionary golden-file characterization (F-005)
        run: pnpm --filter @lifegames/tokens test

  docs-build:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter docs build
