name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ONE RUN PER SHA (atlas decision 0168 item 2). Drafts run CI; the ready flip runs
    # nothing. `ready_for_review` was listed from #275 so a draft flip could not leave a
    # stale green, but the draft run already measured the same sha: 13 heads in 30 days
    # re-ran all 19 checks on an unchanged sha (545 s median critical path, 329
    # runner-minutes). A new commit is a `synchronize`, and `strict: true` forces a new sha
    # when main moves, so a ready PR is never merged on a result for another sha.
    # `scripts/ci-workflow-shape.test.mjs` pins this list.
    types: [opened, synchronize, reopened]

# `packages: read` lets every install resolve @j0nathan-ll0yd/portal-contract
# (and @j0nathan-ll0yd/config) from GitHub Packages; `contents: read` covers
# checkout. See the "Authenticate to GitHub Packages" step in each job.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# WHY EVERY LONG STEP RUNS UNDER `bash scripts/ci-heartbeat.sh`
# GitHub terminates a self-hosted job at a server-side INACTIVITY deadline of roughly 600s, and
# the trigger is SILENCE, not duration. Over 1792 runs / 10444 jobs (2026-05-26 to 2026-10-02),
# 15 jobs in this repo ran LONGER than 600s and concluded success — the longest 947s — while 23
# finished in the 596-604s band and NOT ONE of those concluded success. Every band job whose log
# survives retention shows a single silent interval of 906.3s to 1104.1s ending after the kill,
# and the container kept executing for up to 518.6s past GitHub's own `completed_at` stamp, so
# the fleet was never the terminator. `pnpm install --frozen-lockfile` is where they stalled most
# often, and
# it prints NOTHING while the registry is unreachable. `timeout-minutes` cannot see that failure:
# it bounds duration, and duration was never the problem. The wrapper prints a line a minute so
# the deadline never sees a silent interval, and caps the wrapped command so the heartbeat cannot
# become a licence to hang. See scripts/ci-heartbeat.sh for what it does NOT cover.

# WHY NO REQUIRED JOB CAN SKIP
# Branch protection on main requires eight contexts, and GitHub counts a SKIPPED required job as
# satisfied. On 2026-10-27 build-tokens failed on an upload-artifact ECONNRESET at PR #333's
# 005ed18; test-swift, web-browser-runtime and governance-gates skipped on their failed `needs:`,
# and the PR read mergeable with three required gates never run. So every required job here
# reports on every event:
#   - A fork PR is refused by a RED first step, before checkout: these jobs run on self-hosted
#     hardware, which must not execute fork code, and a skip would read as a pass. Push the
#     branch to this repository to measure it.
#   - A job with `needs:` runs under `!cancelled() || needs.build-tokens.result != 'success'`,
#     and its `build-tokens must have succeeded` step reds before checkout unless the need
#     succeeded. On a run cancel GitHub re-evaluates the `if:` of "all currently running jobs"
#     and cancels each one whose condition is now false (docs: workflow-cancellation, step 1).
#     The docs say nothing about queued or not-yet-started jobs, so for those the no-skip
#     property rests on measurement, not on the docs. So:
#       need failed or cancelled  -> the job runs and reds at the guard, no suite (PR #339 runs
#                                    41094878303, 41102726858);
#       need succeeded, then the run is cancelled or superseded while the job runs -> the job
#                                    is CANCELLED, which frees its runner and still blocks a
#                                    merge (documented; runs 41096602512 mid-suite and
#                                    41104464607 superseded);
#       need succeeded, then the run is cancelled while the job is queued -> CANCELLED as well
#                                    (measured only: run 41098524113, and 0 dependents skipped
#                                    after build-tokens succeeded across 96 cancelled DS CI runs
#                                    in history).
#     This holds only while a cancel also cancels the upstream job. Each upstream `if:` must
#     carry no status function and must keep the fork check; the shape test pins every one.
#     Plain `!cancelled()` SKIPS the job when the run is cancelled during its need. `always()`
#     keeps a cancelled run's job running to completion. A step-level `if: cancelled()` reads
#     false in a job that starts after the cancel (run 41011529722).
# package-version-drift aggregates its needs the same way. `scripts/ci-workflow-shape.test.mjs`
# pins every expression verbatim.

jobs:
  format:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Refuse to run fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=format cannot evaluate a fork PR::This gate runs on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check. Push the branch to this repository and re-run."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      # format:check runs dprint (TS/JS/JSON) + prettier (astro/md/mdx/css).
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: format
        run: pnpm format:check

  typecheck:
    # tsc --noEmit across the packages that extend @j0nathan-ll0yd/config's
    # tsconfig-base (schemas, fixtures, web, storybook). `turbo run typecheck`
    # builds workspace deps first (^build) so cross-package types resolve.
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Refuse to run fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=typecheck cannot evaluate a fork PR::This gate runs on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check. Push the branch to this repository and re-run."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: typecheck
        run: pnpm typecheck

  packages:
    # FOLDED INSTALL-ONLY JOBS (atlas decision 0168 item 4): `schemas-freshness`, `copy` and
    # `fixtures` were three containers, each paying ~30 s of checkout, setup and install to run
    # 50-60 s of work, against a Colima cap that drops to 6 while test-swift holds a macOS VM.
    # Each gate is still its own named step, prefixed with the job it came from, and every gate
    # step runs under `!cancelled()` once install succeeded: one red gate does not hide the next,
    # and the failing step still names its gate.
    #
    # REQUIRED CONTEXT (owner decision 2026-10-30). At the fold none of these gates was required,
    # so a red in any of them never blocked a merge. `packages` is now required, so it follows
    # the "WHY NO REQUIRED JOB CAN SKIP" rule above: no job-level `if:`, and a fork PR reds at the
    # first step, before checkout. The last step, `packages`, is the A2b exact-step binding: it
    # reds unless every gate step concluded success, so a red `packages` names that step.
    #
    # Freshness runs FIRST, on the clean checkout. The copy and fixtures builds below regenerate
    # committed artifacts, and the freshness git-diff must judge what is committed, not what an
    # earlier step in this job wrote.
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Refuse to run fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=packages cannot evaluate a fork PR::This gate runs on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check. Push the branch to this repository and re-run."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: install
        run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      # schemas-freshness: verifies vendored LP schemas + generated TS/Swift artifacts are not
      # stale. Soft on missing LP (CI has no LP checkout) — vendored/ is the source of truth in CI.
      # The contract-lock model and schema URN unit suites run in governance-gates, a required
      # context, under `pnpm test:scripts`.
      - name: schemas-freshness
        id: schemas-freshness
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:schemas-freshness
      - name: 'schemas-freshness: verify schema contract'
        id: schemas-contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !contains(github.event.pull_request.labels.*.name, 'skip-contract-check') }}
        run: pnpm -F @j0nathan-ll0yd/schemas contract:verify
        env:
          CONTRACT_CHECK_MODE: blocking
      # copy — @j0nathan-ll0yd/copy: build (validate rich + derive flat + codegen TS/Zod/Swift),
      # unit tests (Ajv + ICU MF1 parse + maxChars + flat round-trip), and the D9
      # zero-dependency leaf-boundary lint. The freshness git-diff of copy's
      # generated artifacts is the schemas-freshness step above.
      - name: 'copy: build'
        id: copy-build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @j0nathan-ll0yd/copy build
      - name: 'copy: test'
        id: copy-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @j0nathan-ll0yd/copy test
      - name: 'copy: lint'
        id: copy-lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @j0nathan-ll0yd/copy lint
      # Grep gate: fail if a migrated copy value reappears hardcoded
      # in consumer source (DS web widgets + runtime + Swift widgets).
      - name: 'copy: grep-gate'
        id: copy-grep-gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @j0nathan-ll0yd/copy grep-gate
      # Voice & mechanics gate: the register/audience enum is enforced by the
      # build (Ajv); check-copy-voice.mjs adds banned terms, punctuation, and the
      # human↔AI arbitration rule (no allusion in machine surfaces). See VOICE.md.
      - name: 'copy: voice'
        id: copy-voice
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @j0nathan-ll0yd/copy voice
      # fixtures — @j0nathan-ll0yd/fixtures: generate (deterministic raw + post-adapter fixtures) +
      # validate (Ajv against portal-contract raw + @j0nathan-ll0yd/schemas display schemas)
      # + unit tests (barrel shape + starredRepos adapter-derived determinism) + lint.
      # The freshness git-diff of the committed fixture output is the schemas-freshness step
      # above (it re-runs `pnpm -F @j0nathan-ll0yd/fixtures generate`).
      - name: 'fixtures: build'
        id: fixtures-build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @j0nathan-ll0yd/fixtures build
      - name: 'fixtures: test'
        id: fixtures-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @j0nathan-ll0yd/fixtures test
      - name: 'fixtures: lint'
        id: fixtures-lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @j0nathan-ll0yd/fixtures lint
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md). The verdict reds unless
      # every gate step above concluded success. A gate that failed reds its own step too; a gate
      # that SKIPPED (install failed, or a fork PR) reds only here. Each GATE_ variable reads one
      # gate step's outcome, and the shape test pins that every gate step has exactly one.
      # The one waiver: the `skip-contract-check` label skips the contract step by design.
      - name: packages
        if: ${{ !cancelled() }}
        env:
          GATE_SCHEMAS_FRESHNESS: ${{ steps.schemas-freshness.outcome }}
          GATE_SCHEMAS_CONTRACT: ${{ steps.schemas-contract.outcome }}
          GATE_COPY_BUILD: ${{ steps.copy-build.outcome }}
          GATE_COPY_TEST: ${{ steps.copy-test.outcome }}
          GATE_COPY_LINT: ${{ steps.copy-lint.outcome }}
          GATE_COPY_GREP_GATE: ${{ steps.copy-grep-gate.outcome }}
          GATE_COPY_VOICE: ${{ steps.copy-voice.outcome }}
          GATE_FIXTURES_BUILD: ${{ steps.fixtures-build.outcome }}
          GATE_FIXTURES_TEST: ${{ steps.fixtures-test.outcome }}
          GATE_FIXTURES_LINT: ${{ steps.fixtures-lint.outcome }}
          WAIVED: ${{ contains(github.event.pull_request.labels.*.name, 'skip-contract-check') && 'GATE_SCHEMAS_CONTRACT' || '' }}
        run: |
          set -euo pipefail
          gates=$(compgen -v GATE_ || true)
          if [ -z "$gates" ]; then
            echo "::error title=packages verdict read no gate::No GATE_ variable is set, so this step measured nothing. It reports RED rather than passing."
            exit 1
          fi
          failed=0
          for gate in $gates; do
            outcome="${!gate}"
            if [ "$outcome" = 'success' ]; then
              echo "$gate: success"
            elif [ "$outcome" = 'skipped' ] && [ "$gate" = "$WAIVED" ]; then
              echo "$gate: skipped by the skip-contract-check label"
            else
              echo "::error title=packages gate did not pass::$gate concluded '$outcome'. Every gate in this job must conclude success."
              failed=1
            fi
          done
          exit "$failed"

  drift-engine-filter:
    # Answers one question for the jobs below: did this change touch the drift engine or the
    # contract it is held to? It lives in its own job because BOTH the self-test jobs and the
    # required `package-version-drift` job need the answer, and a `steps.<id>.outputs` value
    # cannot cross a job boundary.
    #
    # Fork PRs skip this job (same condition as every other job here), which leaves the required
    # job's refusal step to report RED — see its first step.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    outputs:
      engine: ${{ steps.drift-engine-changes.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect drift-engine / contract changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: drift-engine-changes
        with:
          # The two c147-package-drift files are the engine and its unit/self-test
          # suite. The contract itself used to live in scripts/fixtures/**; since
          # atlas decision 0079 item 4 wave 2 it arrives as
          # @j0nathan-ll0yd/estate-contracts, so the lockfile is now the file that
          # changes when the vectors, the runners or the extractor change. Watching
          # pnpm-lock.yaml is deliberately WIDER than the retired path (any dependency
          # bump trips it) — a contract change that skipped the self-test is the failure
          # this gate exists to prevent. Wider and correct beats narrower and blind.
          #
          # That width used to be expensive, which is why narrowing it kept being
          # tempting. Sharding the self-test (below) is what made the width cheap, so
          # the filter no longer has to trade coverage for cost. The shard driver is
          # watched too: it decides which mutants run, so a change to it must re-prove
          # the partition is still total.
          filters: |
            engine:
              - 'audits/checks/c147-package-drift.mjs'
              - 'audits/checks/c147-self-test-shard.sh'
              - 'audits/__tests__/c147-package-drift.test.mjs'
              - 'audits/__tests__/c147-self-test-shard.test.mjs'
              - 'pnpm-lock.yaml'

  drift-self-test-baseline:
    # Rung 1 of the self-test: the UN-MUTATED suite is green. Separated from the mutation rungs
    # so those can be sharded without dropping this one. It is load-bearing and cannot be
    # inferred from the mutation rungs: a mutant is scored "killed" purely by its target scenario
    # failing, so a broken baseline makes mutants look killed for the wrong reason. That is why
    # the full run checks the baseline FIRST, and why sharding the mutants alone would have
    # quietly retired a measurer.
    #
    # Measured: 53.6s, 191 MiB peak RSS — one process, no fan-out.
    needs: drift-engine-filter
    if: needs.drift-engine-filter.outputs.engine == 'true'
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      - name: Known-answer self-test — baseline rung
        run: bash scripts/ci-heartbeat.sh node audits/checks/c147-package-drift.mjs --self-test --baseline-only

  drift-self-test-shard:
    # Rung 2 of the self-test: the suite CAN fail — all 31 source mutations must be killed.
    #
    # RUNNER-DEATH ROOT CAUSE, AND WHY THIS IS A MATRIX. Running the mutation rungs inside ONE
    # job fanned out `min(31, os.availableParallelism())` mutant processes — 16 lanes on the
    # highmem tier, ~176-193 MiB each, measured peak 1501 MiB for the job. On the shared
    # self-hosted arm64 fleet, concurrent jobs from unrelated PRs exhaust the physical host's RAM
    # and the OOM killer reaps a runner VM mid-step; the log blob never flushes (`BlobNotFound`)
    # and this required context goes RED having measured nothing. Recorded in atlas
    # `audits/audits.yaml` under A2's evidence for design-system-Lifegames run 32654389950
    # (main@6828871): the job "concluded failure with 9 of its 14 steps concluded and NOT ONE of
    # them a failure", and the false red "propagated into a design review". It is NOT a TCP-port
    # collision — the toy registry binds an ephemeral port and each VM has its own network
    # namespace; the contention is for host RAM.
    #
    # Each shard runs its mutants ONE AT A TIME, so peak RSS per job is a single mutant (~193
    # MiB) instead of sixteen, and per-job wall clock drops to a fraction of the full run — which
    # shrinks the window in which a job can be reaped. Parallelism moves ACROSS runners, where
    # each shard has its own memory, instead of WITHIN one runner. `max-parallel` caps the
    # aggregate fleet footprint at ~4 x 193 MiB, still well under the 1501 MiB this replaces.
    #
    # The shard count is duplicated in drift-self-test-nightly.yml on purpose — the two lanes must
    # run the same partition. `audits/__tests__/c147-self-test-shard.test.mjs` asserts they agree,
    # that the matrix enumerates 1..N with no gaps, and that the partition covers every mutation
    # the engine declares. Coverage is never a hand-kept list: the driver reads the ids from the
    # engine on every run.
    needs: drift-engine-filter
    if: needs.drift-engine-filter.outputs.engine == 'true'
    runs-on: [self-hosted, linux, arm64, node]
    strategy:
      # fail-fast MUST stay false. With it on, one failing shard cancels its siblings, and a
      # cancelled shard's mutants are neither killed nor reported — the aggregate would still be
      # a failure, but the log would name one survivor when there could be several.
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      - name: Known-answer self-test — mutation shard ${{ matrix.shard }}/8
        run: bash scripts/ci-heartbeat.sh bash audits/checks/c147-self-test-shard.sh ${{ matrix.shard }} 8

  package-version-drift:
  # Required content-drift gate: registry authentication and a real build are part of the check.
  # Fork PRs fail before checkout because skipped required checks pass, while running fork code
  # on self-hosted hardware is unsafe. Push the branch to this repository to measure it.
  #
  # This is the job branch protection requires, so its NAME must not change and it must report on
  # every event. It aggregates the self-test jobs itself rather than letting `needs` gate it,
  # because a plain `needs` would SKIP this job when a self-test job fails — and GitHub counts a
  # skipped required check as satisfied, which is the exact failure mode (a green-looking gate
  # that measured nothing) this job exists to avoid. Its `if:` keeps it running whenever a need
  # failed or was cancelled, so the aggregate step reds; a cancelled run whose needs all passed or
  # skipped cancels it, which frees the node-highmem runner (PR #339 run 41096602512).
    needs: [drift-engine-filter, drift-self-test-baseline, drift-self-test-shard]
    if: ${{ !cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    runs-on: [self-hosted, linux, arm64, node-highmem]
    steps:
      - name: Refuse to measure fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=package-version-drift cannot evaluate a fork PR::This gate builds and packs the workspace on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check - it would claim 'no drift' having measured nothing. Push the branch to this repository and re-run."
          exit 1
      # FAIL-CLOSED AGGREGATION. Every outcome is enumerated and the default is failure, so a
      # result this step does not recognise reds the gate instead of falling through. For a matrix
      # job `needs.<job>.result` is 'success' only when EVERY shard succeeded, so one survivor in
      # one shard fails the required context.
      - name: Self-test rungs must have passed
        env:
          FILTER_RESULT: ${{ needs.drift-engine-filter.result }}
          ENGINE_TOUCHED: ${{ needs.drift-engine-filter.outputs.engine }}
          BASELINE_RESULT: ${{ needs.drift-self-test-baseline.result }}
          SHARD_RESULT: ${{ needs.drift-self-test-shard.result }}
        run: |
          set -euo pipefail
          echo "filter=$FILTER_RESULT engine=$ENGINE_TOUCHED baseline=$BASELINE_RESULT shards=$SHARD_RESULT"

          if [ "$FILTER_RESULT" != 'success' ]; then
            echo "::error title=drift self-test gating could not be evaluated::drift-engine-filter concluded '$FILTER_RESULT'. Without its answer this job cannot tell whether the self-test was required, so it reports RED rather than guessing."
            exit 1
          fi

          if [ "$ENGINE_TOUCHED" = 'true' ]; then
            # The self-test was required. Both rungs must have actually succeeded — 'skipped'
            # and 'cancelled' are failures here, not exemptions.
            for rung in "baseline:$BASELINE_RESULT" "shards:$SHARD_RESULT"; do
              name="${rung%%:*}"
              result="${rung#*:}"
              if [ "$result" != 'success' ]; then
                echo "::error title=drift self-test $name rung did not pass::This change touches the drift engine or its contract, so the self-test was required. The $name rung concluded '$result'. A required gate must not go green on an unproven engine."
                exit 1
              fi
            done
            echo "self-test required and passed: baseline green, all mutation shards green."
            exit 0
          fi

          # The self-test was not required, so both rungs must be 'skipped'. Anything else means
          # they ran and did not pass, which still reds the gate.
          for rung in "baseline:$BASELINE_RESULT" "shards:$SHARD_RESULT"; do
            name="${rung%%:*}"
            result="${rung#*:}"
            case "$result" in
              skipped) ;;
              success) echo "note: $name rung ran and passed although it was not required." ;;
              *)
                echo "::error title=drift self-test $name rung concluded '$result'::It was not required for this change, but it did not skip cleanly either. That is reported rather than ignored."
                exit 1
                ;;
            esac
          done
          echo "self-test not required for this change (engine and contract untouched); nightly covers main."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      # The digest conformance suite (the 35 shared estate-contracts vectors and the
      # DRIFT_CONFORMANCE_SHA256 fixture pin) and the shard-partition totality suite run in
      # governance-gates, also a required context, under `pnpm test:scripts`.
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: package-version-drift
        run: bash scripts/ci-heartbeat.sh node audits/checks/c147-package-drift.mjs --lane=branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tokens:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - name: DTCG 2025.10 conformance check
        run: node audits/checks/d3-validate-dtcg.mjs
      # DTCG is the one D3 gate that runs OUTSIDE governance-gates, which is why D3's runner names
      # this job as a second entry. Its known-answer suite, d3-validate-dtcg.test.mjs, runs in
      # governance-gates under `pnpm test:scripts`. governance-gates `needs:` this job and reds
      # unless it succeeded, so a red here blocks the required context too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: token-dist
          path: packages/tokens/dist/

  web-builds:
    # FOLDED INSTALL-ONLY JOBS (atlas decision 0168 item 4): `lint-web`, `build-web`,
    # `storybook-build` and `docs-build` were four containers, each paying ~30 s of setup and a
    # queue slot for 20-60 s of work. None is a required context. Each gate is still its own named
    # step and runs under `if: ${{ !cancelled() }}`, so one red gate does not hide the next.
    # Lint runs first, on the clean checkout, before any build writes to the tree.
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - name: lint-web
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: 'lint-web: CSP inline-JS audit (Plan #07 sibling gate)'
        if: ${{ !cancelled() }}
        run: pnpm -F @j0nathan-ll0yd/web audit:inline-scripts
      # pnpm<=9 exited 0 with a warning when the filtered package had no "build"
      # script — @j0nathan-ll0yd/web has none (it ships source, not a build artifact), so this job
      # never built anything. pnpm 11 turned the missing script into a hard error,
      # exposing it. Run the real workspace build (turbo) instead.
      - name: build-web
        if: ${{ !cancelled() }}
        run: pnpm build
      # The visual-regression guard suite (issue #145) runs in governance-gates, a required
      # context, under `pnpm test:scripts`.
      - name: storybook-build
        if: ${{ !cancelled() }}
        run: pnpm --filter storybook storybook:build
      # Optional Chromatic step:
      # - uses: chromaui/action@latest
      #   with:
      #     projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      #     storybookBuildDir: apps/storybook/storybook-static
      - name: docs-build
        if: ${{ !cancelled() }}
        run: pnpm --filter docs build

  # The Swift job runs on a self-hosted Mac (shared with ios-LifegamesPortal).
  # Deliberately the ONLY macOS job — one cold compile + one queue acquisition
  # per run (see .omc/plans/contract-tests-ci-perf.md).
  # Security: the first step refuses a fork PR with a RED result before checkout, so
  # untrusted code from forks never executes on the host Mac and the required context
  # never passes by skipping. Internal-branch PRs and pushes to main run normally.
  # External contributors: maintainer must re-push the PR to a branch in this repo.
  test-swift:
    needs: [build-tokens]
    if: ${{ !cancelled() || needs.build-tokens.result != 'success' }}
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 20
    env:
      SNAPSHOT_ENV: ci
      # Prevent snapshot tests from recording new reference images in CI;
      # any mismatch is a test failure, not a silent re-record.
      SNAPSHOT_TESTING_RECORD: never
    steps:
      - name: Refuse to run fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=test-swift cannot evaluate a fork PR::This gate runs on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check. Push the branch to this repository and re-run."
          exit 1
      - name: build-tokens must have succeeded
        env:
          BUILD_TOKENS_RESULT: ${{ needs.build-tokens.result }}
        run: |
          if [ "$BUILD_TOKENS_RESULT" != 'success' ]; then
            echo "::error title=test-swift cannot run without build-tokens::build-tokens concluded '$BUILD_TOKENS_RESULT'. This gate needs the token-dist artifact, so it reports RED rather than skipping: GitHub treats a skipped job as satisfying a required status check. Fix or re-run build-tokens."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode.app' \) 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 not found. Available versions:"
            ls /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      # Also enforces the cross-platform fixture contract (LifegamesWidgetsTests/ContractTests).
      # Do not add --filter — that would silently drop contract coverage.
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: test-swift
        run: swift test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: snapshot-diffs
          # A red guard step leaves no snapshots to upload.
          if-no-files-found: ignore
          path: Tests/**/__Snapshots__/**/*.png

  contract-ts:
    # Web Props TypeScript contract check — moved off the macOS runner (no Xcode dep).
    # The Swift side of the contract is covered by test-swift's unfiltered `swift test`
    # (Tests/LifegamesWidgetsTests/ContractTests.swift).
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Refuse to run fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=contract-ts cannot evaluate a fork PR::This gate runs on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check. Push the branch to this repository and re-run."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      # This job runs the web unit suite (updaters/adapters — the TS side of the
      # Props contract), which previously ran in NO CI job.
      # It deliberately does NOT typecheck: packages/web gained a real
      # tsconfig.json in #142 and is type-checked by the dedicated `typecheck`
      # job (turbo run typecheck), so duplicating it here would only add runtime.
      # The step that used to sit here (pnpm --filter @j0nathan-ll0yd/web tsc) was a
      # silent no-op — no tsconfig meant tsc printed help and exited 0 via
      # pnpm<=9's implicit exec fallback. See #110.
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: contract-ts
        run: pnpm --filter @j0nathan-ll0yd/web test

  # Real-browser half of the web runtime suite. Separate from contract-ts because
  # that job runs on a node-labelled runner with no browser binaries, and separate
  # from visual-regression because this asserts behavior, not pixels.
  #
  # It exists because jsdom structurally cannot answer the question it asks. jsdom
  # performs no <picture> source selection, so a dead <source> and a live one look
  # identical to it -- which is how 3.0.0 shipped an image fallback that set
  # img.src correctly and still painted a broken glyph in every real browser.
  web-browser-runtime:
    # The scripts-off suite renders the widgets with the real token CSS
    # (packages/tokens/dist/tokens.css), so it needs the token build.
    needs: build-tokens
    if: ${{ !cancelled() || needs.build-tokens.result != 'success' }}
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 15
    steps:
      - name: Refuse to run fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=web-browser-runtime cannot evaluate a fork PR::This gate runs on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check. Push the branch to this repository and re-run."
          exit 1
      - name: build-tokens must have succeeded
        env:
          BUILD_TOKENS_RESULT: ${{ needs.build-tokens.result }}
        run: |
          if [ "$BUILD_TOKENS_RESULT" != 'success' ]; then
            echo "::error title=web-browser-runtime cannot run without build-tokens::build-tokens concluded '$BUILD_TOKENS_RESULT'. This gate needs the token-dist artifact, so it reports RED rather than skipping: GitHub treats a skipped job as satisfying a required status check. Fix or re-run build-tokens."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: web-browser-runtime
        run: pnpm --filter @j0nathan-ll0yd/web test:browser

  governance-gates:
    name: governance-gates
    needs: build-tokens
    if: ${{ !cancelled() || needs.build-tokens.result != 'success' }}
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Refuse to run fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=governance-gates cannot evaluate a fork PR::This gate runs on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check. Push the branch to this repository and re-run."
          exit 1
      - name: build-tokens must have succeeded
        env:
          BUILD_TOKENS_RESULT: ${{ needs.build-tokens.result }}
        run: |
          if [ "$BUILD_TOKENS_RESULT" != 'success' ]; then
            echo "::error title=governance-gates cannot run without build-tokens::build-tokens concluded '$BUILD_TOKENS_RESULT'. This gate needs the token-dist artifact, so it reports RED rather than skipping: GitHub treats a skipped job as satisfying a required status check. Fix or re-run build-tokens."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The conformance BASELINE FREEZE (atlas decision 0102 move 1b) compares
          # contracts/component-catalog/conformance-baseline.json against its own copy at the
          # merge base with the target branch. The default depth-1 checkout fetches only the
          # ref under test, so `origin/main` does not exist and there is no shared ancestor to
          # resolve — and the freeze treats an unresolvable base as RED, never as a skip. Full
          # history is what makes it resolvable. GitHub Actions sets CI, which is what arms the
          # freeze; there is deliberately no env var here to remove.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      # The nine gate probes are folded into ONE step whose name is the required-check
      # context, so the merge gate binds to a step that runs the decisive commands.
      # Per-probe granularity in the Actions UI is the accepted trade; the default
      # `bash -e` shell means this step's exit code is the first failing probe's.
      - name: governance-gates
        env:
          # The baseline freeze resolves its base as the MERGE BASE with origin/main. On the
          # pull_request lane that is the fork point and the comparison is real. On the PUSH lane it
          # is VACUOUS: origin/main IS the pushed commit, so merge-base(origin/main, HEAD) == HEAD,
          # the baseline is compared against itself, every growth set is empty and the freeze passes.
          # Measured: a gap absorbed directly on main gave `failures: 0`. So on a push, hand the
          # freeze the commit that was there BEFORE it — that is a real ancestor and a real
          # comparison. Empty on pull_request, where merge-base is already correct.
          #
          # Skipped when it is the null sha (branch creation, no prior commit to compare against) —
          # the merge-base path then applies as before. `CATALOG_BASELINE_BASE` rejects HEAD and any
          # descendant of it, so this cannot be turned into a self-comparison.
          CATALOG_FREEZE_PUSH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [ -n "$CATALOG_FREEZE_PUSH_BASE" ] && [ "$CATALOG_FREEZE_PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            export CATALOG_BASELINE_BASE="$CATALOG_FREEZE_PUSH_BASE"
            echo "[freeze] push lane — comparing the baseline against $CATALOG_BASELINE_BASE"
          fi
          # Widget inventory drift (P5)
          pnpm widget:inventory -- --check
          # P1 token parity (web/Swift accent hex)
          node audits/checks/d3-token-parity.mjs --check
          # WCAG-AA contrast gate
          node audits/checks/d3-contrast.mjs
          # P3 Swift widget purity — widgets AND components. GOVERNANCE.md §5 bans the app-only
          # imports for "a DS component"; the scan covered only Sources/LifegamesWidgets/, so a
          # component importing HealthKit exited 0. Measured across the 34 component files at the
          # time of widening: zero hits, so the wider gate went green immediately.
          node audits/checks/d3-swift-widget-purity.mjs --check
          # Watch exclusions (F-014)
          node audits/checks/d3-watch-exclusions.mjs --check
          # P4/P7 promotion gate
          node audits/checks/d3-promotion.mjs --check
          # P2 widget compliance (registry ↔ Astro/fixture/manifest)
          node audits/checks/d3-widget-compliance.mjs
          # Component-contract catalog + conformance ratchet (atlas decision 0060;
          # Phoenix eval GAP 2). Five checks: grammar conformance, entry validity,
          # completeness, the CONFORMANCE RATCHET, and idempotence. It ran ONLY in
          # .husky/pre-push, so DS_SKIP_PREPUSH=1 was enough to merge a hand-edited
          # contract, an unregenerated source change, or a new widget carrying
          # neither a behavioral test nor an a11y label. governance-gates is a
          # required status context; a gate that cannot block is not a gate.
          # Offline and ~0.4s, so it costs this step nothing.
          pnpm check:component-catalog
          # openspec-covers (atlas decision 0102 ranked move 5). design-system had 0
          # capabilities and no openspec/ tree at all; it now has one — widget-contract —
          # and this is the gate that keeps it honest in BOTH directions: a requirement
          # that loses its covering test reds, and a `// covers:` tether naming no
          # requirement reds. The rule is not in this repo: it resolves from the
          # exact-pinned @j0nathan-ll0yd/estate-contracts, and the wrapper verifies the
          # shipped bytes against the sidecar shipped beside them before it runs. No
          # `|| true` — blocking is the point, and governance-gates is the required
          # status context, so this is where it binds.
          pnpm check:covers
          # Widget-rule known answers, web side (atlas decision 0160). The Swift twin of a web state
          # rule is held to one shared file, contracts/widget-rules/*.known-answers.json:
          # WidgetRulesTests reads it in test-swift, and this run proves the web rule still returns
          # every listed state. Without it a change to the web rule alone would leave both suites
          # green while the platforms disagree. It runs here because governance-gates is a required
          # status context and the file lives outside packages/web/tests. ~1s.
          pnpm -F @j0nathan-ll0yd/web exec vitest run --config ../../contracts/widget-rules/vitest.config.mjs
          # Web widget-purity lint (P1 raw hex, P3 forbidden imports / module-scope fetch, W16
          # props-extend-schema). It runs HERE and not only in web-builds' lint-web step because
          # governance-gates is a required status context and web-builds is not.
          # `pnpm lint` alone was not a gate either way — both P3 and W16 were configured 'warn' and
          # the script carried no --max-warnings, so a widget importing axios beside a .types.ts with
          # no schema import printed `2 problems (0 errors, 2 warnings)` and exited 0. They are
          # 'error' now, the glob covers .css and .astro, and --max-warnings 0 closes the rest.
          # Measured blast radius of the raise across the whole tree: zero existing violations.
          pnpm -F @j0nathan-ll0yd/web lint
          # Fixture-map validators (schemas and fixtures). validate.ts over the real map ran only in
          # web-builds (`pnpm build`) and .husky/pre-push, so no required context failed when a real
          # widget fixture stopped matching its schema. Their fail-closed known-answer suites
          # (validate, fixture-wiring, coffee-tracking-schema) run in `pnpm test:scripts` below.
          LIFEGAMES_VALIDATE_CWD="$PWD" pnpm -F @j0nathan-ll0yd/schemas validate
          pnpm -F @j0nathan-ll0yd/fixtures exec vitest run tests/validate.test.ts
          # Every node:test and RuleTester suite in the repo, in ONE run: the known-answer and
          # can-fail proofs of the gates above (token parity, contrast, Swift purity, watch
          # exclusions, promotion, the catalog ratchet and its baseline freeze, openspec-covers,
          # SSR image fallback, web-lint severity, the local ESLint rules, the fixture-map
          # validators and fixture wiring), the DTCG and package-drift suites, and the CI and
          # release workflow shape contracts. `pnpm test:scripts` was reachable only through
          # .husky/pre-push, so DS_SKIP_PREPUSH=1 skipped it, and seven of its suites ran in no
          # CI job at all. This is the ONLY place CI runs these suites (the shape test excepted, below); a second `node --test` of
          # a covered file anywhere in ci.yml reds scripts/ci-workflow-shape.test.mjs, and so does
          # a narrowed glob that drops a suite. That guard is itself one of these suites, so it also
          # runs alone first: deleting the `pnpm test:scripts` line or narrowing its glob would
          # otherwise stop the guard with it, and nothing would red. Offline; ~30 s.
          node --test scripts/ci-workflow-shape.test.mjs
          pnpm test:scripts
          # Style Dictionary golden-file characterization (F-005)
          pnpm --filter @j0nathan-ll0yd/tokens test
          # S22 preview scheme audit
          bash audits/checks/d3-preview-scheme.sh
          # D6 personal-data scan over every tracked file. It ran only in .husky/pre-commit
          # (staged files) and the weekly audit-ds.yml, so a commit made without hooks (web UI,
          # a bot, a Release PR) reached main unscanned. Offline; ~30 s.
          bash audits/checks/d6-scan-personal-data.sh --full-tree
