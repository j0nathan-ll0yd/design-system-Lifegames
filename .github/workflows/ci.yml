name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` lets every install resolve @j0nathan-ll0yd/portal-contract
# (and @j0nathan-ll0yd/config) from GitHub Packages; `contents: read` covers
# checkout. See the "Authenticate to GitHub Packages" step in each job.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # format:check runs dprint (TS/JS/JSON) + prettier (astro/md/mdx/css).
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: format
        run: pnpm format:check

  typecheck:
    # tsc --noEmit across the packages that extend @j0nathan-ll0yd/config's
    # tsconfig-base (schemas, fixtures, web, storybook). `turbo run typecheck`
    # builds workspace deps first (^build) so cross-package types resolve.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: typecheck
        run: pnpm typecheck

  schemas-freshness:
    # Verifies vendored LP schemas + generated TS/Swift artifacts are not stale.
    # Soft on missing LP (CI has no LP checkout) — vendored/ is the source of truth in CI.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # The lock model decides whether .contract-lock.json churns: CI has no LP
      # checkout, so the sha-preservation branch is the one that runs here every time.
      # Its regression is invisible to check:schemas-freshness (which reads the lock,
      # never regenerates it), so the unit suite runs in the same job as its subject.
      - name: Contract-lock model unit suite
        run: node --test packages/schemas/scripts/contract-lock.test.mjs
      - run: pnpm check:schemas-freshness
      - name: Verify schema contract
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-contract-check')"
        run: pnpm -F @j0nathan-ll0yd/schemas contract:verify
        env:
          CONTRACT_CHECK_MODE: blocking

  package-version-drift:
  # Required content-drift gate: registry authentication and a real build are part of the check.
  # Fork PRs fail before checkout because skipped required checks pass, while running fork code
  # on self-hosted hardware is unsafe. Push the branch to this repository to measure it.
    runs-on: [self-hosted, linux, arm64, node-highmem]
    steps:
      - name: Refuse to measure fork-PR code on a self-hosted runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=package-version-drift cannot evaluate a fork PR::This gate builds and packs the workspace on a self-hosted runner, which would execute fork code on estate hardware. It reports RED rather than skipping, because GitHub treats a skipped job as satisfying a required status check - it would claim 'no drift' having measured nothing. Push the branch to this repository and re-run."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # RUNNER-DEATH ROOT CAUSE (this filter is the remedy). The "Known-answer
      # self-test" step below stands up throwaway repos + an offline registry and
      # re-runs the shipped pipeline under 31 source mutations (the count was 13
      # when this comment was written; the mutants fan out across cores, so the
      # step measured 380.6s on the self-hosted fleet in run 32785190011) — a
      # memory-and-IO-heavy step. Run on EVERY pull request across the shared
      # self-hosted arm64 fleet, two unrelated PRs land on the same physical host
      # and the host exhausts memory; the OOM killer reaps a runner VM mid-step, so
      # the log blob is never flushed (`BlobNotFound`) and `package-version-drift`
      # goes RED on PRs that never touched the drift engine (#165, #167). It is NOT
      # a TCP-port collision: the toy registry already binds an ephemeral port
      # (`server.listen(0, ...)`) and each VM has its own network namespace, so a
      # port could never collide across concurrent jobs — the contention is for host
      # RAM. The fix is to stop paying that cost on PRs that cannot change the
      # verdict: gate the self-test to engine/contract changes here, and run the
      # FULL self-test nightly on a github-hosted runner
      # (.github/workflows/drift-self-test-nightly.yml) as the main-branch safety net.
      # The two ALWAYS-ON steps (digest conformance + unit suite, and the payload
      # drift measurement) keep running unconditionally, so the job still reports the
      # `package-version-drift` status context on every PR — the required-gate
      # contract is intact whether or not the self-test step runs.
      - name: Detect drift-engine / contract changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: drift-engine-changes
        with:
          # The two check-package-drift files are the engine and its unit/self-test
          # suite. The contract itself used to live in scripts/fixtures/**; since
          # atlas decision 0079 item 4 wave 2 it arrives as
          # @j0nathan-ll0yd/estate-contracts, so the lockfile is now the file that
          # changes when the vectors, the runners or the extractor change. Watching
          # pnpm-lock.yaml is deliberately WIDER than the retired path (any dependency
          # bump trips it) — the self-test is memory-heavy, so the cost is real, but a
          # contract change that skipped the self-test is the failure this gate exists
          # to prevent. Wider and correct beats narrower and blind.
          filters: |
            engine:
              - 'scripts/check-package-drift.mjs'
              - 'scripts/check-package-drift.test.mjs'
              - 'pnpm-lock.yaml'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # D4 — THE SHARED DIGEST CONTRACT, AND IT RAN IN NO WORKFLOW AT ALL.
      # scripts/check-package-drift.test.mjs runs the 35 cross-implementation
      # conformance vectors from @j0nathan-ll0yd/estate-contracts/package-digest,
      # AND the assertion that the resolved fixture still hashes to
      # DRIFT_CONFORMANCE_SHA256 — the pin that keeps a vector change visible in
      # this repo's diff. It was reachable only through `pnpm test:scripts`, which
      # appears in .husky/pre-push and in no workflow on any event, so this repo
      # could diverge from the canonical normalization rule with all 20 CI checks
      # green and only a local pre-push hook standing between that and a merge.
      # It runs FIRST: a digest rule that no longer agrees with the estate makes
      # every verdict below meaningless.
      - name: Digest conformance + unit suite (35 shared vectors, fixture checksum)
        run: node --test scripts/check-package-drift.test.mjs
# Exercise the real package-drift pipeline plus source mutants, including wrapper exit semantics.
# Paths gate pull-request cost; the nightly run always executes. npm remains installed to test
# npm/pnpm asymmetry.
      - name: Known-answer self-test (must prove it can fail)
        if: steps.drift-engine-changes.outputs.engine == 'true'
        run: node scripts/check-package-drift.mjs --self-test
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: package-version-drift
        run: node scripts/check-package-drift.mjs --lane=branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  copy:
    # @j0nathan-ll0yd/copy: build (validate rich + derive flat + codegen TS/Zod/Swift),
    # unit tests (Ajv + ICU MF1 parse + maxChars + flat round-trip), and the D9
    # zero-dependency leaf-boundary lint. The freshness git-diff of copy's
    # generated artifacts is covered by the schemas-freshness job above.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @j0nathan-ll0yd/copy build
      - run: pnpm -F @j0nathan-ll0yd/copy test
      - run: pnpm -F @j0nathan-ll0yd/copy lint
      # Grep gate: fail if a migrated copy value reappears hardcoded
      # in consumer source (DS web widgets + runtime + Swift widgets).
      - run: pnpm -F @j0nathan-ll0yd/copy grep-gate
      # Voice & mechanics gate: the register/audience enum is enforced by the
      # build (Ajv); check-copy-voice.mjs adds banned terms, punctuation, and the
      # human↔AI arbitration rule (no allusion in machine surfaces). See VOICE.md.
      - run: pnpm -F @j0nathan-ll0yd/copy voice

  fixtures:
    # @j0nathan-ll0yd/fixtures: generate (deterministic raw + post-adapter fixtures) +
    # validate (Ajv against portal-contract raw + @j0nathan-ll0yd/schemas display schemas)
    # + unit tests (barrel shape + starredRepos adapter-derived determinism) + lint.
    # The freshness git-diff of the committed fixture output is covered by the
    # schemas-freshness job above (it re-runs `pnpm -F @j0nathan-ll0yd/fixtures generate`).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @j0nathan-ll0yd/fixtures build
      - run: pnpm -F @j0nathan-ll0yd/fixtures test
      - run: pnpm -F @j0nathan-ll0yd/fixtures lint

  build-tokens:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - name: DTCG 2025.10 conformance check
        run: node scripts/validate-dtcg.mjs
      # That gate's own known-answer suite. It is the sixth gate atlas catalog check D3
      # names, and the only one that runs OUTSIDE governance-gates — which is why D3's
      # runner had to grow this job as a second entry. The proof runs beside the gate it
      # proves rather than in governance-gates: build-tokens is where the validator lives,
      # and governance-gates `needs:` it, so a red here blocks the required context too.
      - name: Prove the DTCG validator can fail
        run: node --test scripts/validate-dtcg.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-dist
          path: packages/tokens/dist/

  lint-web:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm lint
      - name: CSP inline-JS audit (Plan #07 sibling gate)
        run: pnpm -F @j0nathan-ll0yd/web audit:inline-scripts

  build-web:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      # pnpm<=9 exited 0 with a warning when the filtered package had no "build"
      # script — @j0nathan-ll0yd/web has none (it ships source, not a build artifact), so this job
      # never built anything. pnpm 11 turned the missing script into a hard error,
      # exposing it. Run the real workspace build (turbo) instead.
      - run: pnpm build

  storybook-build:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter storybook storybook:build
      # Optional Chromatic step:
      # - uses: chromaui/action@latest
      #   with:
      #     projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      #     storybookBuildDir: apps/storybook/storybook-static

  # The Swift job runs on a self-hosted Mac (shared with ios-LifegamesPortal).
  # Deliberately the ONLY macOS job — one cold compile + one queue acquisition
  # per run (see .omc/plans/contract-tests-ci-perf.md).
  # Security: the `if` guard below skips it for fork PRs so untrusted code
  # from forks never executes on the host Mac. Internal-branch PRs and
  # pushes to main still run normally. External contributors: maintainer must
  # re-push the PR to a branch in this repo to get Swift coverage.
  test-swift:
    needs: [build-tokens]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 20
    env:
      SNAPSHOT_ENV: ci
      # Prevent snapshot tests from recording new reference images in CI;
      # any mismatch is a test failure, not a silent re-record.
      SNAPSHOT_TESTING_RECORD: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode.app' \) 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 not found. Available versions:"
            ls /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      # Also enforces the cross-platform fixture contract (LifegamesWidgetsTests/ContractTests).
      # Do not add --filter — that would silently drop contract coverage.
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: test-swift
        run: swift test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: snapshot-diffs
          path: Tests/**/__Snapshots__/**/*.png

  contract-ts:
    # Web Props TypeScript contract check — moved off the macOS runner (no Xcode dep).
    # The Swift side of the contract is covered by test-swift's unfiltered `swift test`
    # (Tests/LifegamesWidgetsTests/ContractTests.swift).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # This job runs the web unit suite (updaters/adapters — the TS side of the
      # Props contract), which previously ran in NO CI job.
      # It deliberately does NOT typecheck: packages/web gained a real
      # tsconfig.json in #142 and is type-checked by the dedicated `typecheck`
      # job (turbo run typecheck), so duplicating it here would only add runtime.
      # The step that used to sit here (pnpm --filter @j0nathan-ll0yd/web tsc) was a
      # silent no-op — no tsconfig meant tsc printed help and exited 0 via
      # pnpm<=9's implicit exec fallback. See #110.
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: contract-ts
        run: pnpm --filter @j0nathan-ll0yd/web test

  # Real-browser half of the web runtime suite. Separate from contract-ts because
  # that job runs on a node-labelled runner with no browser binaries, and separate
  # from visual-regression because this asserts behavior, not pixels.
  #
  # It exists because jsdom structurally cannot answer the question it asks. jsdom
  # performs no <picture> source selection, so a dead <source> and a live one look
  # identical to it -- which is how 3.0.0 shipped an image fallback that set
  # img.src correctly and still painted a broken glyph in every real browser.
  web-browser-runtime:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: web-browser-runtime
        run: pnpm --filter @j0nathan-ll0yd/web test:browser

  governance-gates:
    name: governance-gates
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The conformance BASELINE FREEZE (atlas decision 0102 move 1b) compares
          # contracts/component-catalog/conformance-baseline.json against its own copy at the
          # merge base with the target branch. The default depth-1 checkout fetches only the
          # ref under test, so `origin/main` does not exist and there is no shared ancestor to
          # resolve — and the freeze treats an unresolvable base as RED, never as a skip. Full
          # history is what makes it resolvable. GitHub Actions sets CI, which is what arms the
          # freeze; there is deliberately no env var here to remove.
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      # The nine gate probes are folded into ONE step whose name is the required-check
      # context, so the merge gate binds to a step that runs the decisive commands.
      # Per-probe granularity in the Actions UI is the accepted trade; the default
      # `bash -e` shell means this step's exit code is the first failing probe's.
      - name: governance-gates
        env:
          # The baseline freeze resolves its base as the MERGE BASE with origin/main. On the
          # pull_request lane that is the fork point and the comparison is real. On the PUSH lane it
          # is VACUOUS: origin/main IS the pushed commit, so merge-base(origin/main, HEAD) == HEAD,
          # the baseline is compared against itself, every growth set is empty and the freeze passes.
          # Measured: a gap absorbed directly on main gave `failures: 0`. So on a push, hand the
          # freeze the commit that was there BEFORE it — that is a real ancestor and a real
          # comparison. Empty on pull_request, where merge-base is already correct.
          #
          # Skipped when it is the null sha (branch creation, no prior commit to compare against) —
          # the merge-base path then applies as before. `CATALOG_BASELINE_BASE` rejects HEAD and any
          # descendant of it, so this cannot be turned into a self-comparison.
          CATALOG_FREEZE_PUSH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [ -n "$CATALOG_FREEZE_PUSH_BASE" ] && [ "$CATALOG_FREEZE_PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            export CATALOG_BASELINE_BASE="$CATALOG_FREEZE_PUSH_BASE"
            echo "[freeze] push lane — comparing the baseline against $CATALOG_BASELINE_BASE"
          fi
          # Widget inventory drift (P5)
          pnpm widget:inventory -- --check
          # P1 token parity (web/Swift accent hex)
          node scripts/check-token-parity.mjs --check
          # That gate's own known-answer suite. Atlas catalog check D3 named six governance
          # gates and only ONE of them — Swift purity, below — had a can-fail proof (atlas
          # decision 0111 phase 1). The four suites added here and the DTCG suite in
          # build-tokens close that gap. They run HERE for the same reason the purity suite
          # does: reachable only through `pnpm test:scripts` they would live in
          # .husky/pre-push and no workflow, so DS_SKIP_PREPUSH=1 would be enough to merge a
          # gate that stopped gating. Each is offline and well under a second.
          node --test scripts/check-token-parity.test.mjs
          # WCAG-AA contrast gate
          node scripts/check-contrast.mjs
          node --test scripts/check-contrast.test.mjs
          # P3 Swift widget purity — widgets AND components. GOVERNANCE.md §5 bans the app-only
          # imports for "a DS component"; the scan covered only Sources/LifegamesWidgets/, so a
          # component importing HealthKit exited 0. Measured across the 34 component files at the
          # time of widening: zero hits, so the wider gate went green immediately.
          node scripts/check-swift-widget-purity.mjs --check
          # That gate's own known-answer suite — it had NONE, which is why it was one of the three
          # requirements grandfathered in openspec/covers-baseline.json. Two defects lived in the
          # blind spot: the widget-only import scan above, and an exemption in
          # widget-purity-exceptions.json that suppressed a Color(hex:) finding while stating no
          # reason, against the file's own "Reason MUST explain why". Same argument as the suites
          # below: reachable only through `pnpm test:scripts`, it would run in .husky/pre-push and no
          # workflow, so DS_SKIP_PREPUSH=1 would be enough to merge a gate that stopped gating.
          node --test scripts/check-swift-widget-purity.test.mjs
          # Watch exclusions (F-014)
          node scripts/check-watch-exclusions.mjs --check
          node --test scripts/check-watch-exclusions.test.mjs
          # P4/P7 promotion gate
          node scripts/check-promotion.mjs --check
          node --test scripts/check-promotion.test.mjs
          # P2 widget compliance (registry ↔ Astro/fixture/manifest)
          node scripts/widget-compliance.mjs
          # Component-contract catalog + conformance ratchet (atlas decision 0060;
          # Phoenix eval GAP 2). Five checks: grammar conformance, entry validity,
          # completeness, the CONFORMANCE RATCHET, and idempotence. It ran ONLY in
          # .husky/pre-push, so DS_SKIP_PREPUSH=1 was enough to merge a hand-edited
          # contract, an unregenerated source change, or a new widget carrying
          # neither a behavioral test nor an a11y label. governance-gates is a
          # required status context; a gate that cannot block is not a gate.
          # Offline and ~0.4s, so it costs this step nothing.
          pnpm check:component-catalog
          # The ratchet's own known-answer suite, including the CAN-FAIL PROOF for the
          # baseline freeze: a widget added with a new gap plus `--update-baseline` must red,
          # a genuine closure must pass, and a named justified raise must pass. The gate above
          # cannot prove any of that — a freeze arm that silently stopped comparing would leave
          # it green forever. Same argument, same precedent as check-package-drift.test.mjs
          # above and check-ssr-image-fallback.test.mjs below: reachable only through
          # `pnpm test:scripts`, this suite would run in .husky/pre-push and no workflow, so
          # DS_SKIP_PREPUSH=1 would be enough to merge a broken ratchet. ~2s.
          node --test contracts/component-catalog/ratchet.test.mjs
          # openspec-covers (atlas decision 0102 ranked move 5). design-system had 0
          # capabilities and no openspec/ tree at all; it now has one — widget-contract —
          # and this is the gate that keeps it honest in BOTH directions: a requirement
          # that loses its covering test reds, and a `// covers:` tether naming no
          # requirement reds. The rule is not in this repo: it resolves from the
          # exact-pinned @j0nathan-ll0yd/estate-contracts, and the wrapper verifies the
          # shipped bytes against the sidecar shipped beside them before it runs. No
          # `|| true` — blocking is the point, and governance-gates is the required
          # status context, so this is where it binds.
          pnpm check:covers
          # The gate's own known-answer suite, including the CAN-FAIL PROOF: dropping the
          # tether on a real requirement must block, a stale baseline id must fail, and an
          # unparseable baseline must throw rather than degrade to an empty set that
          # passes. Same argument as ratchet.test.mjs above and check-package-drift.test.mjs
          # in package-version-drift: reachable only through `pnpm test:scripts`, it would
          # run in .husky/pre-push and no workflow, so DS_SKIP_PREPUSH=1 would be enough to
          # merge a gate that no longer gates. ~0.3s.
          node --test scripts/openspec-covers.test.mjs
          # SSR image-fallback gate: every .astro that server-renders a
          # data-fallback cover must bundle the load-time initImageFallbacks()
          # call. Mirrors the digest-conformance precedent above
          # (package-version-drift's `node --test scripts/check-package-drift.test.mjs`):
          # reachable only through `pnpm test:scripts` it would live in
          # .husky/pre-push and no workflow, so DS_SKIP_PREPUSH=1 would be enough
          # to merge a widget whose SSR covers can never fall back. It runs HERE
          # rather than in lint-web because governance-gates is a required status
          # context and lint-web is not — a gate that cannot block is not a gate.
          node --test scripts/check-ssr-image-fallback.test.mjs
          # Web widget-purity lint (P1 raw hex, P3 forbidden imports / module-scope fetch, W16
          # props-extend-schema). It runs HERE and not only in lint-web for the reason stated on the
          # SSR gate above: governance-gates is a required status context and lint-web is not.
          # `pnpm lint` alone was not a gate either way — both P3 and W16 were configured 'warn' and
          # the script carried no --max-warnings, so a widget importing axios beside a .types.ts with
          # no schema import printed `2 problems (0 errors, 2 warnings)` and exited 0. They are
          # 'error' now, the glob covers .css and .astro, and --max-warnings 0 closes the rest.
          # Measured blast radius of the raise across the whole tree: zero existing violations.
          pnpm -F @j0nathan-ll0yd/web lint
          # The configuration's own known-answer suite. A RuleTester case passes identically whether
          # its rule is 'warn' or 'error' and never sees the CLI glob, so it cannot prove either of
          # the two things that were actually broken. This asserts the resolved SEVERITY through the
          # real eslint.config.js and that the lint script still scans every extension its rules
          # claim — a regression to 'warn' or a dropped extension reds here.
          node --test scripts/check-web-lint-severity.test.mjs
          # The local ESLint rules' RuleTester suites. They ran in NO workflow and NO hook — not
          # turbo, not `pnpm test:scripts` (whose globs are scripts/, packages/schemas/scripts/ and
          # contracts/component-catalog/ only) — so every rule above was one silent edit away from
          # reporting nothing, with its `// covers:` tether still satisfying check:covers.
          node --test eslint-local-rules/__tests__/*.test.js
          # Style Dictionary golden-file characterization (F-005)
          pnpm --filter @j0nathan-ll0yd/tokens test
          # S22 preview scheme audit
          bash scripts/check-preview-scheme.sh

  docs-build:
    needs: build-tokens
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: token-dist
          path: packages/tokens/dist/
      - run: pnpm --filter docs build
