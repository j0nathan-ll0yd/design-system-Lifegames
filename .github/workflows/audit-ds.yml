name: Audit DS

# lp-audit Phase 4 — DS hygiene audits: widget completeness matrix (D1),
# baseline-age advisory (D2), and yalc publish-staleness (D5).
#
# Report-only (D4/D5): a failure here files/updates a GitHub issue labeled
# audit + audit:report-only. It does not block any other workflow, merge, or
# PR — ci.yml's existing push/PR-triggered gates (widget-compliance.mjs,
# token-parity, etc.) are unaffected. This workflow adds (a) SCHEDULED
# execution of two checks that already existed but were never wired to run
# anywhere (check-baseline-age.mjs, check-yalc-staleness.mjs) and (b) the D1
# widget completeness matrix, which reconciles all 4 widget registries plus
# the filesystem — something scripts/widget-compliance.mjs structurally
# cannot do, since it only validates entries that ARE in production-widgets.json
# and can't detect a widget missing from that registry entirely (see
# scripts/audit-widget-matrix.mjs's header for the concrete drift this caught).
#
# D1 and D2 run in default (non---check) mode and cannot fail this job by
# design — see each script's own report-only framing. Only D5 (yalc:check)
# can fail today; promoting D1 to --check (blocking) is a Phase 6 bake-in
# decision, not made here.

on:
  schedule:
    - cron: '37 5 * * 1' # weekly Monday, off-round minute (D6 — avoid on-the-hour/22:00-02:00 UTC congestion)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-ds # fixed name (D6) — a stuck/slow run never overlaps the next scheduled one
  cancel-in-progress: false

jobs:
  audit:
    name: DS hygiene audits (D1/D2/D5)
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
      - run: pnpm install --frozen-lockfile

      # yalc:check hashes packages/tokens/dist/, which is a gitignored build
      # artifact (not committed) — must build fresh before either D5 or a
      # meaningful D1 Astro/fixture check.
      - run: pnpm build:tokens

      - name: D1 widget completeness matrix
        run: pnpm check:widget-matrix | tee audit-ds-report.txt

      - name: D2 baseline age (advisory)
        run: pnpm baseline:age | tee -a audit-ds-report.txt

      - name: D5 yalc publish staleness
        id: yalc_check
        run: pnpm yalc:check | tee -a audit-ds-report.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## lp-audit DS report — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '```'
            cat audit-ds-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-ds-report
          path: audit-ds-report.txt
          retention-days: 30

      - name: File issue on yalc staleness
        if: steps.yalc_check.outcome == 'failure' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'lp-audit D5: yalc publish staleness detected';

            for (const label of [
              {name: 'audit', color: '0e8a16', description: 'lp-audit monorepo audit system finding'},
              {name: 'audit:report-only', color: 'c5def5', description: 'lp-audit finding — report-only, does not block merges/deploys'},
            ]) {
              await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, ...label}).catch(() => {});
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit',
              per_page: 100,
            });
            const dup = existing.data.find((i) => i.title === title);
            if (dup) {
              core.info(`Open issue already exists (#${dup.number}); appending run link instead of creating a duplicate.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another D5 yalc:check run failed: [View workflow run](${runUrl})`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['audit', 'audit:report-only'],
              body: [
                '## lp-audit D5: Yalc Publish Staleness Detected',
                '',
                'The committed `.yalc-content-hash` no longer matches a fresh `pnpm build:tokens` output —',
                'packages/tokens source changed since the last `pnpm yalc:publish`, so consumers (web, iOS docs)',
                'may be running against stale published bytes. See `scripts/check-yalc-staleness.mjs`.',
                '',
                `**Run:** [View workflow run](${runUrl})`,
                '',
                '### Next Steps',
                '1. Open the `audit-ds-report` artifact (or the job summary) above for the exact hash mismatch.',
                '2. Reproduce locally: `pnpm build:tokens && pnpm yalc:check`.',
                '3. If the source change was intentional, republish: `pnpm yalc:publish` (writes a fresh',
                '   `.yalc-content-hash` and pushes to consumers via yalc).',
                '4. This check is report-only (D4) — it does not block any other CI job, merge, or deploy.',
              ].join('\n'),
            });

      - name: Ping Healthchecks.io
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_AUDIT_DS }}
          YALC_CHECK_RESULT: ${{ steps.yalc_check.outcome }}
        run: |
          if [ -z "${HC_PING_URL:-}" ]; then
            echo "::warning::HC_PING_AUDIT_DS secret is not set — skipping Healthchecks.io ping. This check has not been provisioned in Healthchecks.io yet (plan Phase 0); the dead-man's-switch is not yet monitoring this workflow."
            exit 0
          fi
          if [ "$YALC_CHECK_RESULT" = "success" ]; then
            echo "yalc:check succeeded — pinging success."
            curl -fsS -m 10 --retry 3 "$HC_PING_URL"
          else
            echo "yalc:check=$YALC_CHECK_RESULT — pinging /fail (Healthchecks.io still records the run so the dead-man's-switch itself stays healthy; the /fail signal is separate from the GitHub issue above)."
            curl -fsS -m 10 --retry 3 "$HC_PING_URL/fail"
          fi
