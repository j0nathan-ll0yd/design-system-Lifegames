name: Audit DS

# lp-audit Phase 4 — DS hygiene audits: widget completeness matrix (D1),
# baseline-age advisory (D2), the blocking full-tree personal-data scan
# (D6), and the report-only cover-inventory probe (D7).
#
# Report-only: D1 and D2 run in default (non---check) mode and cannot fail
# this job by design — see each script's own report-only framing. It does not
# block any other workflow, merge, or PR — ci.yml's existing push/PR-triggered
# gates (widget-compliance.mjs, token-parity, etc.) are unaffected. This
# workflow adds (a) SCHEDULED execution of check-baseline-age.mjs, which
# existed but was never wired to run anywhere, and (b) the D1 widget
# completeness matrix, which reconciles all 4 widget registries plus
# the filesystem — something audits/checks/d3-widget-compliance.mjs structurally
# cannot do, since it only validates entries that ARE in production-widgets.json
# and can't detect a widget missing from that registry entirely (see
# audits/checks/d1-widget-matrix.mjs's header for the concrete drift this caught).
#
# Promoting D1 to --check (blocking) is a Phase 6 bake-in decision, not made here.
#
# (D5 yalc publish-staleness was retired with the yalc machinery — atlas#1
# / decision 0015 PR 6. Its runner scripts/check-yalc-staleness.mjs is gone;
# the D5 registration in atlas/audits/audits.yaml is retired separately in Atlas.)

on:
  schedule:
    - cron: '37 5 * * 1' # weekly Monday, off-round minute (D6 — avoid on-the-hour/22:00-02:00 UTC congestion)
  workflow_dispatch:
    inputs:
      scheduled_by_external:
        description: 'Set only by the trusted external scheduler (decision 0092)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read # resolve @j0nathan-ll0yd/portal-contract from GitHub Packages on install

concurrency:
  group: audit-ds # fixed name (D6) — a stuck/slow run never overlaps the next scheduled one
  cancel-in-progress: false

jobs:
  audit:
    name: DS hygiene audits (D1/D2)
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile

      # A meaningful D1 Astro/fixture check needs packages/tokens/dist/, which
      # is a gitignored build artifact (not committed) — build it fresh first.
      - run: pnpm build:tokens

      - name: D1 widget completeness matrix
        # shell: bash enables pipefail so the tee pipe cannot swallow a non-zero
        # exit (B14 / the silent-gate class). D1 runs report-only today, but this
        # keeps the gate honest if it is ever promoted to --check (blocking).
        shell: bash
        run: pnpm check:widget-matrix | tee audit-ds-report.txt

      - name: D2 baseline age (advisory)
        shell: bash
        run: pnpm baseline:age | tee -a audit-ds-report.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## lp-audit DS report — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '```'
            cat audit-ds-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-ds-report
          path: audit-ds-report.txt
          retention-days: 30

  # D6 is separate from the report-only D1/D2 job so its status and blocking
  # semantics are visible to Atlas and in the GitHub Actions job list.
  d6-personal-data-full-tree:
    name: D6 full-tree personal-data scan (blocking)
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keep the scheduled audit on a complete checkout. The scanner
          # currently reads every tracked path at HEAD; full history keeps this
          # lane correct if its tracked-file scope grows to inspect revisions.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: D6 known-answer regression (committed, not staged)
        run: node --test audits/__tests__/d6-scan-personal-data.test.mjs

      - name: D6 scan every tracked file (blocking)
        shell: bash
        run: bash audits/checks/d6-scan-personal-data.sh --full-tree

  # D7 sends HEAD to every COVER_KEYS key on the CloudFront distribution and reports
  # any key that answers otherwise than the committed snapshot says. The fleet reaches
  # CloudFront only from the source-scoped `cfedge` egress lane (ci-runners-private
  # RUNNERS.md "CloudFront edges on their own lane"; NetworkForJob places any job that
  # carries the label). So D7 runs alone on that lane, and the D1/D2 job, with its
  # dependency install, keeps no CloudFront egress. Report-only: the probe exits 0 in
  # every verdict, and a lane without egress reports INDETERMINATE, never PASS.
  #
  # The dead-man ping below does NOT wait on this job: cfedge capacity must never hold
  # the D1/D2/D6 ping past its grace. D7 stays visible on its own: a verdict other than
  # PASS prints a workflow warning annotation and closes the job summary and artifact, and
  # a crash, a red known-answer suite or a job no cfedge runner picks up shows as this
  # job's own conclusion.
  d7-cover-inventory:
    name: D7 cover inventory vs CloudFront (report-only)
    runs-on: [self-hosted, linux, arm64, node, cfedge]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: D7 known-answer regression (offline, stubbed probe)
        run: node --test audits/__tests__/d7-cover-inventory.test.mjs

      - name: D7 probe COVER_KEYS against the distribution (report-only)
        shell: bash
        run: node audits/checks/d7-cover-inventory.mjs | tee audit-ds-d7-report.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## D7 cover inventory — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '```'
            cat audit-ds-d7-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-ds-d7-report
          path: audit-ds-d7-report.txt
          retention-days: 30

  # Separate hosted-runner job (first-cycle finding #14, 2026-07-17): the ping
  # curl timed out (exit 28) from the self-hosted fleet containers while
  # hc-ping.com is reachable from the host — and a ping that rides the audit
  # job dies with a wedged fleet, which is exactly when the dead-man's-switch
  # must still report. Mirrors audit-backend.yml's structure.
  healthcheck-ping:
    name: Healthchecks.io dead-man's-switch ping
    needs: [audit, d6-personal-data-full-tree]
    # TRUSTED-SCHEDULE PREDICATE (atlas decisions 0091/0092). `if: always()` alone
    # let ANY manual workflow_dispatch refresh the dead-man tile, so a dead clock
    # looked alive as long as a human ran the lane by hand — the exact mask 0091
    # measured (the daily lanes fired 9.7-11h late, then missed a day, with every
    # tile green). A ping must answer "did the SCHEDULED run execute", so only the
    # clock may ping: GitHub cron, or a workflow_dispatch that carries the trusted
    # external scheduler's marker (0092 ruling 3). An ordinary human dispatch runs
    # the audits and skips this job. Verbatim the predicate in mantle-LifegamesPortal
    # audit-backend.yml and j0nathan-ll0yd.github.io audit-web.yml.
    #
    # DS is NOT in the external scheduler's slot table today (ci-runners-private
    # src/lib/auditscheduler/schedule.go lists atlas, web and backend only), so the
    # `schedule` half is what carries this ping and the cron above stays the clock.
    # The marker half is the compatibility plumbing 0092 Phase 1 calls for: inert at
    # `default: false` until a slot for this lane is added.
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scheduled_by_external == true))
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 2
    steps:
      - name: Ping Healthchecks.io
        env:
          HC_PING_URL: ${{ secrets.HC_PING_AUDIT_DS }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          D6_RESULT: ${{ needs.d6-personal-data-full-tree.result }}
        run: |
          if [ -z "${HC_PING_URL:-}" ]; then
            echo "::warning::HC_PING_AUDIT_DS secret is not set — skipping Healthchecks.io ping. This check has not been provisioned in Healthchecks.io yet (plan Phase 0); the dead-man's-switch is not yet monitoring this workflow."
            exit 0
          fi
          # Plain ping regardless of check results (WS-A1, plan D-A): the dead-man's-
          # switch answers exactly one question — did the scheduled run EXECUTE? A
          # check that ran and found findings is the system WORKING (findings live in
          # the job summary, report artifact, and post-bake issues). Pinging /fail on
          # findings marks the tile DOWN — indistinguishable from a wedged/never-ran
          # job. Same convention as audit-web.yml and the hub launchd run-*.sh.
          echo "audit job result=$AUDIT_RESULT; D6 result=$D6_RESULT — pinging run-completion."
          curl -fsS -m 10 --retry 3 "$HC_PING_URL"
