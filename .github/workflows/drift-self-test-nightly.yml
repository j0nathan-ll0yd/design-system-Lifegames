name: Drift self-test (nightly, full)

# THE MAIN-BRANCH SAFETY NET for the C147 package-drift gate's known-answer
# self-test (audits/checks/c147-package-drift.mjs --self-test).
#
# WHY THIS EXISTS
# On pull requests the self-test step in ci.yml is gated to engine/contract
# changes (dorny/paths-filter over audits/checks/c147-package-drift.mjs,
# audits/__tests__/c147-package-drift.test.mjs and pnpm-lock.yaml, which is where the contract now moves since atlas decision 0079
# item 4 wave 2 replaced scripts/fixtures/** with the published
# @j0nathan-ll0yd/estate-contracts), because running that memory-heavy step on
# EVERY PR across the shared self-hosted arm64 fleet let two unrelated PRs exhaust
# a physical host's RAM and get a runner VM OOM-reaped mid-step (`BlobNotFound`),
# reddening the required gate on PRs that never touched the drift engine. Gating
# the step removes that load — but it also means a PR that skipped the self-test
# could, in principle, land a regression that only the self-test would catch (e.g.
# a change to shared tooling the mutations exercise indirectly). This workflow
# closes that gap: it re-runs the FULL self-test — baseline + all 31 source
# mutations, no skipping — against main every night, and on demand.
#
# WHY self-hosted linux arm64 node
# Self-hosted estate policy requires all jobs to run on self-hosted runners.
#
# This block used to claim that "memory isolation in c147-package-drift.mjs ensures the
# self-test runs within memory limits without OOM-reaping". That was wrong, and it was wrong
# in the direction that hurts: this workflow WAS reaped on 2026-09-23 (run 35854756898 — the
# mutation step ran 16m31s and was cancelled with not one failing step). The engine bounds its
# own per-process memory, but nothing bounded the SUM of the mutant processes it fanned out, and
# the shared physical host is what runs out of RAM. The remedy is the sharding below, not a
# claim about isolation.

on:
  schedule:
    # 06:12 UTC daily. Off-round minute to dodge on-the-hour scheduler congestion,
    # and ahead of the 07:00 post-publish drift schedule so the two never pile up.
    - cron: '12 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  # Fixed name (no ref): a slow/stuck run never overlaps the next scheduled one.
  group: drift-self-test-nightly
  cancel-in-progress: true

jobs:
  # SHARDED, and the shard count MUST match ci.yml's `drift-self-test-shard` matrix — the two
  # lanes have to run the same partition or "nightly covers main" stops being true.
  # `audits/__tests__/c147-self-test-shard.test.mjs` asserts they agree.
  #
  # It used to be one job running the whole thing: `--self-test` with no filter, which fanned out
  # min(31, os.availableParallelism()) mutant processes -- 16 lanes on the highmem tier, measured
  # peak 1501 MiB, p50 356s / max 418s over 26 runs. That job was reaped on 2026-09-23 (run
  # 35854756898: the mutation step ran 16m31s and was cancelled with no failing step), the same
  # syndrome atlas records under A2 for design-system run 32654389950. Sharding drops peak RSS per
  # job to a single mutant (~193 MiB) and shortens each job, so the reap window shrinks with it.
  #
  # The `node` tier is now correct where `node-highmem` was needed before: highmem was chosen for
  # its 16 vCPU because the harness's in-job fan-out was the thing being scaled. A shard runs its
  # mutants one at a time, so per-job CPU demand is one process and the parallelism comes from the
  # matrix instead.
  drift-self-test-baseline:
    # Rung 1: the un-mutated suite is green. Measured 53.6s, 191 MiB peak RSS.
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Needed for the cascade rung (S26): the self-test symlinks this repo's
      # node_modules/@changesets into a throwaway fixture and runs the real
      # @changesets/get-release-plan probe against it.
      - run: pnpm install --frozen-lockfile
      - name: Known-answer self-test — baseline rung
        run: node audits/checks/c147-package-drift.mjs --self-test --baseline-only

  drift-self-test-shard:
    # Rung 2: all 31 mutations killed. No path gate here — the nightly always runs every shard,
    # which is what makes it the main-branch safety net for PRs whose filter skipped the rungs.
    runs-on: [self-hosted, linux, arm64, node]
    strategy:
      # See ci.yml: fail-fast off so one failing shard does not cancel its siblings and hide
      # survivors that would otherwise be named.
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Known-answer self-test — mutation shard ${{ matrix.shard }}/8
        run: bash audits/checks/c147-self-test-shard.sh ${{ matrix.shard }} 8

  drift-self-test:
    # FAIL-CLOSED AGGREGATION, and the job whose conclusion represents this workflow. Without it a
    # reaped or skipped shard would leave the run's overall conclusion looking clean; the name is
    # kept from the pre-sharding job so anything watching this workflow still finds it.
    needs: [drift-self-test-baseline, drift-self-test-shard]
    if: always()
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Every self-test rung must have passed
        env:
          BASELINE_RESULT: ${{ needs.drift-self-test-baseline.result }}
          SHARD_RESULT: ${{ needs.drift-self-test-shard.result }}
        run: |
          set -euo pipefail
          echo "baseline=$BASELINE_RESULT shards=$SHARD_RESULT"
          # Unlike the PR lane there is no filter here: the nightly runs every rung every night,
          # so 'skipped' is a failure and so is anything other than success.
          for rung in "baseline:$BASELINE_RESULT" "shards:$SHARD_RESULT"; do
            name="${rung%%:*}"
            result="${rung#*:}"
            if [ "$result" != 'success' ]; then
              echo "::error title=nightly drift self-test $name rung concluded '$result'::The nightly is the main-branch safety net for PRs whose path filter skipped these rungs. A rung that did not succeed means main is unproven."
              exit 1
            fi
          done
          echo "nightly self-test green: baseline plus all mutation shards."
