name: Visual Regression

on:
  # Manual trigger for baseline updates and one-off verification runs.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update snapshot baselines (commit result manually)'
        type: boolean
        default: false

  pull_request:
    paths:
      - 'tokens/**'
      - 'packages/tokens/**'
      - 'packages/web/**'
      - 'apps/storybook/src/**'
      - 'apps/storybook/.storybook/**'
      - 'packages/web/stories/**'

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: bash scripts/ci-setup-portal-contract.sh
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      # NOTE: no "build web package" step — @lifegames/web exports TypeScript
      # source directly (its exports map points at ./src/*.ts; the package has
      # no build script). A `pnpm --filter @lifegames/web build` step sat here
      # as a silent no-op under pnpm 9 and became a hard
      # ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT after the pnpm 11 bump (#109).
      - name: Build Storybook
        run: pnpm --filter storybook storybook:build

      - name: Install Playwright browsers
        run: pnpm --filter storybook exec playwright install --with-deps chromium

      - name: Serve Storybook static build
        run: |
          pnpm dlx serve -l 6006 apps/storybook/storybook-static &
          echo $! > /tmp/serve.pid
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -sf http://localhost:6006 > /dev/null; do sleep 1; done'

      - name: Run visual regression (update mode)
        if: ${{ inputs.update_snapshots == true }}
        run: pnpm --filter storybook storybook:visual:update
        # storybook:visual:update uses -u flag (jest-image-snapshot baseline refresh)
        env:
          TARGET_URL: http://localhost:6006

      - name: Run visual regression (check mode)
        if: ${{ inputs.update_snapshots != true }}
        run: pnpm --filter storybook storybook:visual
        env:
          TARGET_URL: http://localhost:6006

      - name: Stop Storybook server
        if: always()
        run: kill $(cat /tmp/serve.pid) 2>/dev/null || true

      - name: Upload updated baselines (update mode)
        if: ${{ inputs.update_snapshots == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-baselines-${{ github.run_id }}
          path: apps/storybook/__snapshots__/
          retention-days: 7

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diffs-${{ github.run_id }}
          path: apps/storybook/__snapshots__/__diff__/
          retention-days: 14
