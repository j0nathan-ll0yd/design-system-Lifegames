name: Visual Regression

on:
  # Manual trigger for baseline updates and one-off verification runs.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update snapshot baselines (commit result manually)'
        type: boolean
        default: false

  # Every input a story render reads. scripts/visual-regression-paths.test.mjs
  # walks the story import graph and fails when an input falls outside this list.
  pull_request:
    paths:
      # Render sources: tokens, CSS, story code, the copy and fixture data stories import.
      - 'tokens/**'
      - 'packages/tokens/**'
      - 'packages/web/**'
      - 'packages/copy/**'
      - 'Sources/LifegamesWidgets/Resources/widgets/**'
      - 'apps/storybook/src/**'
      - 'apps/storybook/.storybook/**'
      # The token build that writes packages/tokens/dist/*.css.
      - 'style-dictionary.config.mjs'
      - 'scripts/emit-platform.mjs'
      # Space Grotesk, served to Storybook through staticDirs.
      - 'apps/docs/public/fonts/**'
      # The gate itself: baselines, runner config and this workflow.
      - 'apps/storybook/__snapshots__/**'
      - 'apps/storybook/test-runner-jest.config.mjs'
      - '.github/workflows/visual-regression.yml'
      # Toolchain: Storybook, lit, Playwright, jest-image-snapshot and Node versions.
      - 'apps/storybook/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` lets the install resolve @j0nathan-ll0yd/portal-contract
# from GitHub Packages; `contents: read` covers checkout.
permissions:
  contents: read
  packages: read

jobs:
  visual-regression:
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: bash scripts/ci-heartbeat.sh pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      # NOTE: no "build web package" step — @j0nathan-ll0yd/web exports TypeScript
      # source directly (its exports map points at ./src/*.ts; the package has
      # no build script). A `pnpm --filter @j0nathan-ll0yd/web build` step sat here
      # as a silent no-op under pnpm 9 and became a hard
      # ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT after the pnpm 11 bump (#109).
      - name: Build Storybook
        run: pnpm --filter storybook storybook:build

      # The labelled runner image owns the browser payload. Resolve it through the
      # same Playwright package used by the test runner, without reaching apt/CDNs.
      - name: Resolve preinstalled Playwright Chromium
        run: |
          CHROMIUM_PATH="$(pnpm --filter storybook exec node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")"
          if [[ -z "$CHROMIUM_PATH" || ! -x "$CHROMIUM_PATH" ]]; then
            echo "::error::Preinstalled Playwright Chromium is missing or not executable: $CHROMIUM_PATH"
            exit 1
          fi
          echo "Using preinstalled Playwright Chromium at $CHROMIUM_PATH"

      # `serve` is an exact-pinned storybook devDependency, installed through the
      # lockfile above. `pnpm dlx` fetched the latest release on every run, which
      # bypassed the lockfile and minimumReleaseAge, and a registry retry inside
      # the 30 s wait failed the job. NO_UPDATE_CHECK stops serve calling npm
      # before it listens, so no step of the startup touches the network.
      - name: Serve Storybook static build
        env:
          NO_UPDATE_CHECK: '1'
        run: |
          # A stale server on the port would answer the readiness probe below.
          if curl -s http://localhost:6006 > /dev/null; then
            echo "::error::Port 6006 already answers HTTP before the Storybook server starts"
            exit 1
          fi
          pnpm --filter storybook exec serve --no-clipboard --no-port-switching -l 6006 storybook-static &
          SERVE_PID=$!
          echo "$SERVE_PID" > /tmp/serve.pid
          for second in $(seq 1 60); do
            if ! kill -0 "$SERVE_PID" 2>/dev/null; then
              wait "$SERVE_PID" && status=0 || status=$?
              echo "::error::Storybook server exited with status $status before it accepted connections"
              exit 1
            fi
            if curl -sf http://localhost:6006 > /dev/null; then
              echo "Storybook server ready after ${second} s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Storybook server accepted no connection on port 6006 within 60 s"
          exit 1

      - name: Run visual regression (update mode)
        if: ${{ inputs.update_snapshots == true }}
        run: pnpm --filter storybook storybook:visual:update
        # The update wrapper moves the old set aside, mints with -u from an empty
        # snapshot directory, and restores the old set if the run fails.
        env:
          TARGET_URL: http://localhost:6006

      - name: Run visual regression (check mode)
        if: ${{ inputs.update_snapshots != true }}
        run: pnpm --filter storybook storybook:visual
        env:
          TARGET_URL: http://localhost:6006

      - name: Stop Storybook server
        if: always()
        run: kill "$(cat /tmp/serve.pid)" 2>/dev/null || true

      - name: Upload updated baselines (update mode)
        if: ${{ inputs.update_snapshots == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-baselines-${{ github.run_id }}
          path: apps/storybook/__snapshots__/
          retention-days: 7

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-diffs-${{ github.run_id }}
          path: apps/storybook/__snapshots__/__diff__/
          retention-days: 14
