name: Swift Gallery

on:
  pull_request:
    paths:
      - "apps/swift-gallery/**"
      - "Sources/LifegamesTokens/**"
      - "Sources/LifegamesComponents/**"
      - "Sources/LifegamesWidgets/**"
      - "Sources/LifegamesOnboarding/**"
      - "Sources/LifegamesSchemas/**"
      - "Package.swift"
      - "tokens/**"
      - ".github/workflows/swift-gallery.yml"

jobs:
  build:
    name: Build SwiftGallery (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode.app' \) 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 found" >&2; exit 1; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # NOTE: -destination is intentionally 'generic/platform=iOS Simulator'
      # rather than a pinned (name=iPhone X, OS=Y). The self-hosted runner
      # currently runs macOS 15.7.7 which the installed Xcode SDK refuses
      # to load a concrete simulator on. The generic destination compiles
      # the binary without booting a simulator. Re-pin once the runner's
      # macOS is upgraded; see issue tracking host-runner OS upgrade.
      - name: Build
        run: |
          xcodebuild build \
            -project apps/swift-gallery/SwiftGallery.xcodeproj \
            -scheme SwiftGallery \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
