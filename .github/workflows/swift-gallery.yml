name: Swift Gallery

on:
  pull_request:
    paths:
      - 'apps/swift-gallery/**'
      - 'Sources/LifegamesTokens/**'
      - 'Sources/LifegamesComponents/**'
      - 'Sources/LifegamesWidgets/**'
      - 'Sources/LifegamesOnboarding/**'
      - 'Sources/LifegamesSchemas/**'
      - 'Package.swift'
      - 'tokens/**'
      - '.github/workflows/swift-gallery.yml'

jobs:
  build:
    name: Build SwiftGallery (iOS Simulator)
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode.app' \) 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 found" >&2; exit 1; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # NOTE: -destination is 'generic/platform=iOS Simulator' because this job
      # only BUILDS the app: a generic destination compiles without booting a
      # simulator, so it needs no device or runtime pin. The lane can boot a
      # concrete simulator: measured 2026-10-08 it runs macOS 26.4 (25E246),
      # Xcode 26.4.1 (17E202) and iOS runtime 26.4.1 (23E254a), and
      # swift-snapshots.yml boots a pinned iPhone 17 Pro on it to run tests.
      - name: Build
        run: |
          xcodebuild build \
            -project apps/swift-gallery/SwiftGallery.xcodeproj \
            -scheme SwiftGallery \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
