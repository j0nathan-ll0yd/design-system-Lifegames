name: Swift Gallery

on:
  pull_request:
    paths:
      - "apps/swift-gallery/**"
      - "Sources/LifegamesTokens/**"
      - "Sources/LifegamesComponents/**"
      - "Sources/LifegamesWidgets/**"
      - "Sources/LifegamesOnboarding/**"
      - "Sources/LifegamesSchemas/**"
      - "Package.swift"
      - "tokens/**"
      - ".github/workflows/swift-gallery.yml"

jobs:
  build:
    name: Build SwiftGallery (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild build \
            -project apps/swift-gallery/SwiftGallery.xcodeproj \
            -scheme SwiftGallery \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
