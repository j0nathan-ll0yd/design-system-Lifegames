name: SwiftGallery
options:
  bundleIdPrefix: com.lifegames
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: P328YB6M54
    SWIFT_VERSION: 6.0
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    OTHER_SWIFT_FLAGS: ""

packages:
  LifegamesDesignSystem:
    path: ../..

targets:
  SwiftGallery:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SwiftGallery
    resources:
      - path: SwiftGallery/Resources/Assets.xcassets
    info:
      path: SwiftGallery/Resources/Info.plist
      properties:
        CFBundleName: Swift Gallery
        CFBundleDisplayName: Swift Gallery
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifegames.swift-gallery
        INFOPLIST_FILE: SwiftGallery/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P328YB6M54
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: LifegamesDesignSystem
        product: LifegamesTokens
      - package: LifegamesDesignSystem
        product: LifegamesComponents
      - package: LifegamesDesignSystem
        product: LifegamesWidgets
      - package: LifegamesDesignSystem
        product: LifegamesOnboarding
      - package: LifegamesDesignSystem
        product: LifegamesSchemas
